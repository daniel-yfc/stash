name: PR Scraper Check

on:
  pull_request:
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'
      - 'tools/scraper-quality-gate.sh'
      - 'skills/stash-scraper-builder/**'
      - 'tools/**'
      - 'requirements.txt'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install documentation-check dependencies
        run: python -m pip install pyyaml jsonschema

      - name: Check documentation examples and contradictions
        run: python tools/check_scraper_docs.py

      - name: Get changed scraper files
        id: changed
        uses: tj-actions/changed-files@v46
        with:
          files: |
            scrapers/**/*.yml

      - name: Validate changed scrapers
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          echo "## Scraper PR Check" > results.md
          echo "" >> results.md
          echo "| File | Result |" >> results.md
          echo "| --- | --- |" >> results.md

          FAILED=0
          IFS=' ' read -ra CHANGED <<< "${{ steps.changed.outputs.all_changed_files }}"
          for scraper in "${CHANGED[@]}"; do
            [ -z "$scraper" ] && continue
            if bash tools/scraper-quality-gate.sh "$scraper"; then
              echo "| \`$scraper\` | ✅ PASS |" >> results.md
            else
              echo "| \`$scraper\` | ❌ FAIL — see workflow log |" >> results.md
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

      - name: Comment results on PR
        if: always() && steps.changed.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- scraper-pr-check -->';
            const body = marker + '\n' + fs.readFileSync('results.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
