name: Pull Request Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  documentation:
    name: Documentation contradiction check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install documentation-check dependencies
        run: python -m pip install pyyaml jsonschema
      - name: Check documentation examples and contradictions
        run: python tools/check_scraper_docs.py
