name: Link Check

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly, Sunday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--verbose --no-progress skills/stash-scraper-builder/**/*.md README.md'
          fail: false

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lychee-results
          path: lychee/out.md
          if-no-files-found: ignore
