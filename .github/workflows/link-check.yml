name: Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v1
        with:
          args: '--verbose --no-progress skills/stash-scraper-builder/**/*.md README.md'
          fail: false

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lychee-results
          path: ${{ github.workspace }}/lychee/out.md
