name: Eval Pack

# Manual evaluation runner for the pytest suite in tests/.
# Status: P4 (workstream H) — evaluation coverage is expected to expand
# as workstream H2 progresses.

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Test file to run (e.g., test_scrapers.py). Leave empty to run the full suite.'
        required: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run evaluation tests
        run: |
          TARGET="tests/"
          if [ -n "${{ github.event.inputs.test_file }}" ]; then
            TARGET="tests/${{ github.event.inputs.test_file }}"
          fi
          echo "::group::Evaluation run"
          echo "Target: ${TARGET}"
          python -m pytest "${TARGET}" -v
          echo "::endgroup::"
