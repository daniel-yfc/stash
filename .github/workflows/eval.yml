name: Eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Validate scrapers
        run: |
          deno run -R=scrapers,validator/scraper.schema.json validator/index-zh-TW.mjs -a -s scrapers/
      # TODO: remove continue-on-error once the 5 eval example scrapers exist in scrapers/
      - name: Run eval pack
        continue-on-error: true
        run: |
          ./scripts/eval-run.sh
