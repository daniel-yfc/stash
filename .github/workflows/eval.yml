name: Eval Pack

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Tasks to run (1-5, comma-separated). Default: all'
        required: false
        default: '1,2,3,4,5'

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Display task info
        run: |
          echo "::group::Eval Pack Info"
          echo "Running tasks: ${{ github.event.inputs.tasks || '1,2,3,4,5' }}"
          echo ""
          echo "Task 1: New XPath site (public HTML)"
          echo "Task 2: Site variant (subdomain / locale mirror)"
          echo "Task 3: Login-gated site (cookie session)"
          echo "Task 4: JSON API / embedded JSON-LD site"
          echo "Task 5: Anti-bot / CDP-required site"
          echo "::endgroup::"

      - name: Note
        run: |
          echo "::notice::Eval pack is P4 (workstream H). Failures are expected until H2 (#40) is complete."
