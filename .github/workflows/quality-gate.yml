name: Scraper Quality Gate

on:
  push:
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'
      - 'scripts/scraper-quality-gate.sh'
      - 'skills/stash-scraper-builder/references/scraper.schema.json'
  pull_request:
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'
      - 'scripts/scraper-quality-gate.sh'
      - 'skills/stash-scraper-builder/references/scraper.schema.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Make scripts executable
        run: chmod +x scripts/scraper-quality-gate.sh

      - name: Get changed scraper files
        id: changed-scrapers
        uses: tj-actions/changed-files@v46
        with:
          files: |
            scrapers/**/*.yml

      - name: Run Quality Gate on changed scrapers
        if: steps.changed-scrapers.outputs.any_changed == 'true'
        run: |
          echo "=== Running Scraper Quality Gate ==="

          # Get list of changed scraper files
          CHANGED_SCRAPERS="${{ steps.changed-scrapers.outputs.all_changed_files }}"

          FAILED=0
          for scraper in $CHANGED_SCRAPERS; do
            echo "Checking $scraper..."
            if bash scripts/scraper-quality-gate.sh "$scraper"; then
              echo ""
              echo "✅ $scraper PASSED"
            else
              echo ""
              echo "❌ $scraper FAILED"
              FAILED=1
            fi
            echo ""
          done

          if [ $FAILED -ne 0 ]; then
            echo "::error::Quality gate failed for one or more scrapers"
            exit 1
          fi
