name: Lint 5 Rules

on:
  push:
    paths:
      - 'scrapers/**/*.yml'
      - 'scrapers/*.yml'
  pull_request:
    paths:
      - 'scrapers/**/*.yml'
      - 'scrapers/*.yml'

jobs:
  lint-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint 5 Rules
        run: |
          #!/bin/bash
          set -e
          
          echo "=== Linting 5 Rules ==="
          echo ""
          
          ERRORS=0
          
          # Find all scraper YAML files (excluding private directory for cookies check)
          PUBLIC_SCRAPERS=$(find scrapers -maxdepth 1 -name '*.yml' -type f 2>/dev/null || true)
          
          if [ -z "$PUBLIC_SCRAPERS" ]; then
            echo "No public scraper files found in scrapers/ directory"
            exit 0
          fi
          
          echo "Checking public scrapers:"
          echo "$PUBLIC_SCRAPERS"
          echo ""
          
          for file in $PUBLIC_SCRAPERS; do
            echo "Checking $file..."
            
            # Rule 1: No root 'name:' key
            if grep -q "^name:" "$file"; then
              echo "  ❌ ERROR: Root 'name:' key found (should use filename as scraper name)"
              ERRORS=$((ERRORS + 1))
            fi
            
            # Rule 2: No root 'documentHeader:' key
            if grep -q "^documentHeader:" "$file"; then
              echo "  ❌ ERROR: Root 'documentHeader:' key found (forbidden)"
              ERRORS=$((ERRORS + 1))
            fi
            
            # Rule 3: No root '$vars:' key
            if grep -q "^\$vars:" "$file"; then
              echo "  ❌ ERROR: Root '\$vars:' key found (forbidden)"
              ERRORS=$((ERRORS + 1))
            fi
            
            # Rule 4: No 'driver.cookies' in public scrapers
            if grep -q "driver\.cookies" "$file" || grep -q "cookies:" "$file"; then
              # Check if it's under driver: block
              if grep -A5 "^driver:" "$file" | grep -q "cookies:"; then
                echo "  ❌ ERROR: 'driver.cookies' found in public scraper (belongs in scrapers/private/)"
                ERRORS=$((ERRORS + 1))
              fi
            fi
            
            # Rule 5: Check useCDP placement (should only be in top-level driver, not entry points)
            # Check if useCDP appears under sceneByURL, sceneByName, etc. (entry points)
            if grep -A20 "^sceneByURL:" "$file" | grep -q "useCDP:" || \
               grep -A20 "^sceneByName:" "$file" | grep -q "useCDP:" || \
               grep -A20 "^sceneByFragment:" "$file" | grep -q "useCDP:" || \
               grep -A20 "^performerByURL:" "$file" | grep -q "useCDP:" || \
               grep -A20 "^groupByURL:" "$file" | grep -q "useCDP:"; then
              echo "  ❌ ERROR: 'useCDP' found inside entry point (should be in top-level driver block only)"
              ERRORS=$((ERRORS + 1))
            fi
            
            echo "  ✓ Passed"
            echo ""
          done
          
          echo "=== Lint Summary ==="
          if [ $ERRORS -eq 0 ]; then
            echo "✅ All 5 rules passed!"
            exit 0
          else
            echo "❌ Found $ERRORS error(s)"
            echo ""
            echo "Rules checked:"
            echo "  1. No root 'name:' key"
            echo "  2. No root 'documentHeader:' key"
            echo "  3. No root '\$vars:' key"
            echo "  4. No 'driver.cookies' in public scrapers"
            echo "  5. 'useCDP' only in top-level driver block (not entry points)"
            echo ""
            echo "See AGENTS.md and SKILL.md for full rule documentation."
            exit 1
          fi
