name: Test Eval Workflow

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      scraper_file:
        description: 'Scraper file to test (e.g., ACCEED.yml)'
        required: false

permissions:
  contents: read

jobs:
  test-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Show workflow info
        run: |
          echo "🔍 Testing eval workflow"
          echo "Scraper file: ${{ inputs.scraper_file || 'ACCEED.yml' }}"
          echo ""
          echo "📁 Directory structure:"
          ls -la

      - name: Test validator
        run: |
          echo "🔍 Testing validator..."
          cd validator
          deno run --allow-read --allow-write index-zh-TW.mjs ../scrapers/${{ inputs.scraper_file || 'ACCEED.yml' }}
        continue-on-error: true

      - name: Summary
        run: |
          echo ""
          echo "💡 Next steps:"
          echo "1. Check the logs above for any errors"
          echo "2. Run the full eval workflow when ready"
