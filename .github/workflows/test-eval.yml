name: Test Eval Workflow

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      scraper_file:
        description: 'Scraper file to test (e.g., ACCEED.yml)'
        required: false

permissions:
  contents: read

jobs:
  test-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show workflow info
        run: |
          echo "🔍 Testing scraper via quality gate"
          echo "Scraper file: ${{ inputs.scraper_file || 'ACCEED.yml' }}"

      - name: Run quality gate
        run: |
          bash tools/scraper-quality-gate.sh "scrapers/${{ inputs.scraper_file || 'ACCEED.yml' }}"

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "💡 Next steps:"
          echo "1. Check the logs above for any errors"
          echo "2. Run 'bash tools/validate-all.sh' locally for the full set"
          echo "3. Run the Eval Pack workflow for the pytest suite"
