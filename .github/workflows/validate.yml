name: Validate Scrapers

on:
  push:
    branches: [main]
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Validate scraper schemas
        run: node validator/index.mjs -a scrapers

      - name: Check URL array sorting
        run: node validator/index.mjs -a -s scrapers

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install documentation-check dependencies
        run: python -m pip install pyyaml jsonschema

      - name: Check documentation examples
        run: python tools/check_scraper_docs.py
