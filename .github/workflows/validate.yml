name: Validate Scrapers

on:
  push:
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'
      - 'scripts/scraper-quality-gate.sh'
      - 'skills/stash-scraper-builder/references/scraper.schema.json'
  pull_request:
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'
      - 'scripts/scraper-quality-gate.sh'
      - 'skills/stash-scraper-builder/references/scraper.schema.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Run full scraper validation
        run: |
          echo "=== Running Scraper Validation (schema + policy) ==="
          echo ""

          SCRAPERS=$(find scrapers -name "*.yml" -type f | sort)
          FAILED=0
          for scraper in $SCRAPERS; do
            echo "Validating $scraper..."
            if bash scripts/scraper-quality-gate.sh "$scraper"; then
              echo "  ✅ PASS"
            else
              echo "  ❌ FAIL"
              FAILED=1
            fi
            echo ""
          done

          if [ $FAILED -ne 0 ]; then
            echo "::error::Validation failed for one or more scrapers"
            exit 1
          fi
