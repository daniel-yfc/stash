name: Validate Scrapers

on:
  push:
    branches:
      - main
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'
  pull_request:
    branches:
      - main
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate scraper schemas
        run: node validator/index.mjs scrapers

      - name: Check URL array sorting
        run: node validator/index.mjs -s scrapers
