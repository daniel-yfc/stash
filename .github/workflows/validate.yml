name: Validate Scrapers

on:
  push:
    paths:
      - 'scrapers/**/*.yml'
      - 'scrapers/*.yml'
      - 'validator/**'
      - 'skills/stash-scraper-builder/references/scraper.schema.json'
  pull_request:
    paths:
      - 'scrapers/**/*.yml'
      - 'scrapers/*.yml'
      - 'validator/**'
      - 'skills/stash-scraper-builder/references/scraper.schema.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run Validator
        run: |
          echo "=== Running Scraper Validator ==="
          echo ""
          
          # Find all scraper YAML files
          SCRAPERS=$(find scrapers -maxdepth 1 -name '*.yml' -type f | sort)
          
          if [ -z "$SCRAPERS" ]; then
            echo "No scraper files found in scrapers/ directory"
            exit 0
          fi
          
          echo "Validating scrapers:"
          echo "$SCRAPERS"
          echo ""
          
          FAILED=0
          for scraper in $SCRAPERS; do
            echo "Validating $scraper..."
            if deno run --allow-read validator/index-zh-TW.mjs "$scraper"; then
              echo "  ✅ PASS"
            else
              echo "  ❌ FAIL"
              FAILED=1
            fi
            echo ""
          done
          
          if [ $FAILED -eq 1 ]; then
            echo "=== Validation FAILED ==="
            exit 1
          else
            echo "=== All scrapers validated successfully ==="
          fi
