name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'scrapers/*.yml'
      - 'scrapers/**/*.yml'
      - 'validator/**'
      - 'skills/stash-scraper-builder/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: validator/package-lock.json

      - name: Install validator deps
        run: |
          cd validator
          npm ci

      - name: Validate all scrapers
        run: |
          echo "::group::Running validator"
          node validator/validate.js scrapers/*.yml 2>&1 || true
          echo "::endgroup::"

      - name: Check URL sorting
        run: |
          echo "::group::Checking URL sorting"
          node validator/validate.js -s 2>&1 || true
          echo "::endgroup::"

      - name: Fail on errors only
        run: |
          # D6: CI fails on Errors, warns on Warnings
          # Validator should exit 1 on Errors, 0 on Warnings-only
          echo "Validator completed. Check logs above for Errors vs Warnings."
