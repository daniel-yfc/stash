name: Validate Scrapers

on:
  push:
    branches:
      - main
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'
  pull_request:
    branches:
      - main
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Project policy: the upstream stashapp/CommunityScrapers validator and
      # schema are authoritative. Fetch them at run time so validation always
      # tracks upstream master.
      - name: Fetch upstream validator (stashapp/CommunityScrapers)
        run: |
          mkdir -p .upstream-validator
          curl -fsSL https://raw.githubusercontent.com/stashapp/CommunityScrapers/master/validator/index.mjs -o .upstream-validator/index.mjs
          curl -fsSL https://raw.githubusercontent.com/stashapp/CommunityScrapers/master/validator/scraper.schema.json -o .upstream-validator/scraper.schema.json

      # Only needed when the upstream validator uses plain npm imports; Deno
      # resolves npm:/https: imports itself. Kept unconditional for simplicity.
      - name: Install Node validator dependencies
        run: npm install --no-save ajv@8 ajv-formats@3 better-ajv-errors@2 chalk@5 yaml@2

      # No positional arg: the validator walks <script>/../scrapers by default,
      # which resolves to this repo's scrapers/ directory. Upstream currently
      # uses npm: specifiers, so the Deno branch runs with -A (trusted upstream
      # code in CI; avoids per-flag permission breakage across Deno versions).
      - name: Validate scrapers against the upstream schema
        run: |
          if grep -qE "from ['\"](npm:|https:)" .upstream-validator/index.mjs; then
            deno run -A .upstream-validator/index.mjs -a --ci
          else
            node .upstream-validator/index.mjs -a --ci
          fi

      # Advisory until any existing URL-sorting backlog is cleaned up.
      - name: Check URL array sorting (upstream)
        continue-on-error: true
        run: |
          if grep -qE "from ['\"](npm:|https:)" .upstream-validator/index.mjs; then
            deno run -A .upstream-validator/index.mjs -a -s --ci
          else
            node .upstream-validator/index.mjs -a -s --ci
          fi
