name: Validate Scrapers

on:
  push:
    branches: [main]
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scrapers/**/*.yml'
      - 'validator/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    name: Full Test & Validation Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Validate scraper schemas
        run: node validator/index.mjs -a --ci

      - name: Check URL array sorting
        run: node validator/index.mjs -a -s --ci

      - name: Run quality gate across all scrapers
        run: bash tools/validate-all.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyyaml jsonschema

      - name: Run Python regression tests
        run: python -m pytest tools/tests/ -v

      - name: Check documentation examples and contradictions
        run: python tools/check_scraper_docs.py
