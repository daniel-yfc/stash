name: validate

on:
  push:
    paths:
      - 'scrapers/*.yml'
      - 'scrapers/**/*.yml'
      - 'validator/**'
  pull_request:
    paths:
      - 'scrapers/*.yml'
      - 'scrapers/**/*.yml'
      - 'validator/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scrapers
        run: deno run -R=scrapers -R=validator/scraper.schema.json validator/validate.js -a -s scrapers/
        shell: bash
