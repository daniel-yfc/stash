name: "Skill Link Check"
description: "Verify every references/ link in a SKILL.md resolves to a real file"
author: "daniel-yfc"

inputs:
  skill-file:
    description: "Path to SKILL.md"
    required: false
    default: "skills/stash-scraper-builder/SKILL.md"
  extensions:
    description: "Allowed reference extensions (regex alternation)"
    required: false
    default: "md|json"

runs:
  using: "composite"
  steps:
    - name: Check reference links
      shell: bash
      env:
        SKILL_FILE: ${{ inputs.skill-file }}
        EXTENSIONS: ${{ inputs.extensions }}
      run: |
        set -e

        if [ ! -f "$SKILL_FILE" ]; then
          echo "::error::找不到 skill 檔案：$SKILL_FILE"
          exit 1
        fi

        SKILL_DIR=$(dirname "$SKILL_FILE")
        MISSING=0
        CHECKED=0

        echo "檢查 $SKILL_FILE 的 references/ 連結..."

        while IFS= read -r link; do
          link="${link#(}"; link="${link%)}"
          TARGET="$SKILL_DIR/$link"
          CHECKED=$((CHECKED + 1))
          if [ ! -f "$TARGET" ]; then
            echo "::error file=$SKILL_FILE::連結失效：$link（找不到 $TARGET）"
            MISSING=$((MISSING + 1))
          else
            echo "  ✓ $link"
          fi
        done < <(grep -oP "\(references/[A-Za-z0-9._-]+\.($EXTENSIONS)\)" "$SKILL_FILE" | sort -u)

        echo "---"
        echo "檢查 $CHECKED 個連結"

        if [ "$MISSING" -gt 0 ]; then
          echo "::error::$MISSING 個連結失效"
          exit 1
        fi

        echo "全部有效 ✅"

    - name: Check orphan references
      shell: bash
      env:
        SKILL_FILE: ${{ inputs.skill-file }}
      run: |
        SKILL_DIR=$(dirname "$SKILL_FILE")
        REF_DIR="$SKILL_DIR/references"

        if [ ! -d "$REF_DIR" ]; then
          echo "::warning::找不到 references/ 目錄：$REF_DIR"
          exit 0
        fi

        echo "檢查 references/ 中未被 SKILL.md 連結的檔案（孤兒）..."
        ORPHANS=0

        for f in "$REF_DIR"/*.md; do
          [ -e "$f" ] || continue
          NAME=$(basename "$f")
          if ! grep -q "(references/$NAME)" "$SKILL_FILE"; then
            echo "::notice::$NAME 未被 SKILL.md 連結（若為 human-only 文件可忽略）"
            ORPHANS=$((ORPHANS + 1))
          fi
        done

        echo "---"
        echo "$ORPHANS 個孤兒檔案（僅提示，不會失敗）"
