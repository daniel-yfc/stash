<script type="text/babel">/* global React, MULTI_FIELDS, normalizePillValue */
const { useState, useMemo } = React;

/* mirror of MULTI_FIELDS from sections.jsx (kept in sync via file order) */
const _MULTI = {
  scene:     ["Performers", "Groups", "Tags", "URLs"],
  performer: ["Aliases", "URLs"],
  group:     ["Aliases", "URLs", "Tags"],
  studio:    ["Aliases", "Tags"],
  tag:       [],
};
const _isMulti = (t, f) => (_MULTI[t] || []).includes(f);

/* normalise a value:
   - multi field → string[] (accepts existing array or comma/newline string)
   - single field → trimmed string
   returns null when empty                                                */
function _normValue(objectType, fieldEn, v) {
  if (_isMulti(objectType, fieldEn)) {
    const arr = Array.isArray(v)
      ? v.map((x) => String(x).trim()).filter(Boolean)
      : (typeof v === "string" && v.trim())
        ? v.split(/[,、;\n\t]+/).map((s) => s.trim()).filter(Boolean)
        : [];
    return arr.length ? arr : null;
  }
  const s = (v == null ? "" : String(v)).trim();
  return s ? s : null;
}

/* ============================================================
   Netscape cookies.txt parser
   ============================================================
   Format spec: each non-comment, non-blank line has 7 TAB-separated fields:
     domain  includeSubdomains  path  secure  expires  name  value
   Edge cases handled:
     - Blank lines: skipped
     - Lines starting with '#' are comments — EXCEPT '#HttpOnly_' which
       curl uses to mark HttpOnly cookies (strip prefix, set httpOnly=true)
     - Malformed rows (< 7 columns): silently skipped, counted in _errors
     - Value may contain spaces but NOT tabs (spec guarantee)
     - expires = 0 or negative → session cookie
*/
function _parseCookieTxt(raw) {
  const parsed = [];
  let errors = 0;
  if (!raw || typeof raw !== "string") return { parsed, errors };
  const lines = raw.split(/\r?\n/);
  for (const rawLine of lines) {
    const line = rawLine.replace(/\s+$/, "");  // rtrim only; leading tabs matter
    if (!line) continue;
    let httpOnly = false;
    let workLine = line;
    if (workLine.startsWith("#HttpOnly_")) {
      httpOnly = true;
      workLine = workLine.slice("#HttpOnly_".length);
    } else if (workLine.startsWith("#")) {
      continue;  // ordinary comment
    }
    const cols = workLine.split("\t");
    if (cols.length < 7) { errors++; continue; }
    const [domain, incSub, path, secure, expires, name, ...valueParts] = cols;
    const expiresNum = Number(expires);
    parsed.push({
      name: name,
      value: valueParts.join("\t"),   // rejoin in case value contained tab (rare, non-spec)
      domain: domain,
      path: path || "/",
      secure: secure.toUpperCase() === "TRUE",
      httpOnly,
      includeSubdomains: incSub.toUpperCase() === "TRUE",
      expires: Number.isFinite(expiresNum) ? expiresNum : 0,
      session: !Number.isFinite(expiresNum) || expiresNum <= 0,
    });
  }
  return { parsed, errors };
}

/* Turn a parsed cookie array into a single 'name=value; name2=value2' header. */
function _cookiesToHeader(parsed) {
  return parsed.map((c) => `${c.name}=${c.value}`).join("; ");
}

/* Unique domains, preserving first-seen order. */
function _cookieDomains(parsed) {
  const seen = new Set();
  const out = [];
  for (const c of parsed) {
    if (!seen.has(c.domain)) { seen.add(c.domain); out.push(c.domain); }
  }
  return out;
}

/* ============================================================
   Serializers
   ============================================================ */
/* Build the outgoing technical block. Auth values persist in the form
   (so localStorage draft round-trips). Cookie-file CONTENT is the only
   secret that lives in window.__stashSecrets and gets embedded at
   serialize-time only — parsed into structured form, never dumped raw. */
function _buildAuthMethod(methodId, auth, secrets) {
  const src = auth[methodId] || {};
  switch (methodId) {
    case "access_token":
      return { type: "access_token", value: src.value || "" };
    case "api_key_extraction":
      return {
        type: "api_key_extraction",
        sourceUrl: src.sourceUrl || "",
        regex: src.regex || "",
        targetHeader: src.targetHeader || "",
      };
    case "cookie_header":
      return { type: "cookie_header", value: src.value || "" };
    case "api_key_header":
      return { type: "api_key_header", name: src.name || "", value: src.value || "" };
    case "cookie_file": {
      const raw = secrets.cookieFileContent || "";
      const { parsed, errors } = _parseCookieTxt(raw);
      const out = {
        type: "cookie_file",
        filename: src.filename || "",
        count: parsed.length,
        as_header: _cookiesToHeader(parsed),
        domains: _cookieDomains(parsed),
        parsed: parsed,
      };
      if (errors > 0) out.parseErrors = errors;
      if (!raw) out.note = "(not loaded in current session — re-upload the .txt to include cookies)";
      return out;
    }
    default:
      return { type: methodId };
  }
}

function _buildTechnical(form) {
  const t = form.technical || {};
  const s = window.__stashSecrets || {};
  const auth = t.authentication || {};
  const methods = auth.methods || [];
  const authOut = auth.required
    ? {
        required: true,
        methods,
        credentials: methods.map((m) => _buildAuthMethod(m, auth, s)),
      }
    : { required: false };

  return {
    rendering: t.rendering?.dynamic
      ? { dynamic: true, type: t.rendering.type || "unspecified", detail: t.rendering.detail || "" }
      : { dynamic: false },
    pagination: t.pagination?.required
      ? { required: true, detail: t.pagination.detail || "" }
      : { required: false },
    authentication: authOut,
    notes: t.notes || "",
  };
}

/* Build a per-scraper block for JSON output. */
function _buildScraperBlock(form, typeId) {
  const s = form.scrapers[typeId] || {};
  const testCases = (s.testCases || []).map((c) => {
    const expected = {};
    for (const [k, v] of Object.entries(c.expected || {})) {
      const norm = _normValue(typeId, k, v);
      if (norm !== null) expected[k] = norm;
    }
    const out = { url: c.url, expected };
    if (c.notes && c.notes.trim()) out.notes = c.notes.trim();
    return out;
  });
  return {
    objectType: typeId,
    name: resolveScraperName(form, typeId),
    searchPattern: s.searchPattern || "",
    detailPattern: s.detailPattern || "",
    fields: s.fields || [],
    testCases,
  };
}

function toJson(form) {
  const clean = {
    website: form.website,
    scrapers: form.objectTypes.map((t) => _buildScraperBlock(form, t)),
    technical: _buildTechnical(form),
  };
  return JSON.stringify(clean, null, 2);
}

function toMarkdown(form) {
  const w = form.website;
  const lines = [
    "# Scraper Request",
    "",
    "## Target / 目標",
    `- **Website / 網站**: ${w.name || "—"}`,
    `- **Base URL / 網站網址**: ${w.baseUrl ? `\`${w.baseUrl}\`` : "—"}`,
    `- **Scraper name (base) / 爬蟲名稱基底**: ${w.scraperName ? `\`${w.scraperName}\`` : "—"}`,
    `- **Object types / 物件類型**: ${form.objectTypes.map((t) => `\`${t}\``).join(", ")}`,
    "",
  ];

  // Emit one block per scraper
  form.objectTypes.forEach((typeId, idx) => {
    const s = form.scrapers[typeId] || {};
    const objInfo = OBJ_MAP[typeId] || { zh: typeId, en: typeId };
    const scraperName = resolveScraperName(form, typeId);

    lines.push(`## Scraper ${idx + 1} · ${objInfo.en} / ${objInfo.zh}`);
    lines.push("");
    lines.push(`- **Name / 爬蟲名稱**: \`${scraperName}\``);
    lines.push(`- **Object type / 物件類型**: \`${typeId}\``);
    lines.push(`- **Search pattern / 搜尋模式**: ${s.searchPattern ? `\`${s.searchPattern}\`` : "—"}`);
    lines.push(`- **Detail pattern / 詳情頁模式**: ${s.detailPattern ? `\`${s.detailPattern}\`` : "—"}`);
    lines.push("");
    lines.push(`### Fields / 提取欄位`);
    if ((s.fields || []).length) {
      (s.fields || []).forEach((f) => lines.push(`- ${f}`));
    } else {
      lines.push("- _(none)_");
    }
    lines.push("");
    lines.push(`### Test Cases / 測試案例`);
    if (!(s.testCases || []).length) {
      lines.push("_(none)_");
      lines.push("");
    } else {
      s.testCases.forEach((c, i) => {
        lines.push(`#### Case ${i + 1}`);
        lines.push(`- **URL**: ${c.url || "—"}`);
        Object.entries(c.expected || {}).forEach(([k, v]) => {
          const norm = _normValue(typeId, k, v);
          if (norm === null) return;
          if (Array.isArray(norm)) lines.push(`- **${k}**: ${norm.join(", ")}`);
          else lines.push(`- **${k}**: ${norm}`);
        });
        if (c.notes && c.notes.trim()) {
          lines.push(`- **Notes / 附註**: ${c.notes.trim().replace(/\n/g, " ")}`);
        }
        lines.push("");
      });
    }
  });
  const tech = _buildTechnical(form);
  lines.push("## Technical Notes / 技術備註");
  lines.push("");
  lines.push("### Rendering / 渲染方式");
  if (tech.rendering.dynamic) {
    lines.push(`- Dynamic (CDP) — 需要 JS 執行`);
    if (tech.rendering.type) lines.push(`- Type: \`${tech.rendering.type}\``);
    if (tech.rendering.detail) lines.push(`- Detail: ${tech.rendering.detail}`);
  } else {
    lines.push(`- Static HTML — 一般 HTTP 請求即可`);
  }
  lines.push("");
  lines.push("### Pagination / 分頁");
  if (tech.pagination.required) {
    lines.push(`- Required — 需要處理分頁`);
    if (tech.pagination.detail) lines.push(`- Detail: ${tech.pagination.detail}`);
  } else {
    lines.push(`- None — 單頁即可取得所有資料`);
  }
  lines.push("");
  lines.push("### Authentication / 登入驗證");
  if (tech.authentication.required) {
    lines.push(`- Required — 需要憑證`);
    lines.push(`- Methods: ${(tech.authentication.methods || []).join(", ") || "(unspecified)"}`);
    (tech.authentication.credentials || []).forEach((cred) => {
      lines.push("");
      switch (cred.type) {
        case "access_token":
          lines.push(`#### Access Token / 存取權杖`);
          lines.push(`- Value: \`${cred.value || "(empty)"}\``);
          break;
        case "api_key_extraction":
          lines.push(`#### API Key Extraction / API 金鑰擷取`);
          lines.push(`- Source URL: \`${cred.sourceUrl || "(empty)"}\``);
          lines.push(`- Regex: \`${cred.regex || "(empty)"}\``);
          lines.push(`- Target header: \`${cred.targetHeader || "(empty)"}\``);
          break;
        case "cookie_header":
          lines.push(`#### Cookie Header / 靜態 Cookie`);
          lines.push(`- Value: \`${cred.value || "(empty)"}\``);
          break;
        case "api_key_header":
          lines.push(`#### API Key Header / API 金鑰 Header`);
          lines.push(`- Header name: \`${cred.name || "(empty)"}\``);
          lines.push(`- Key value: \`${cred.value || "(empty)"}\``);
          break;
        case "cookie_file":
          lines.push(`#### Cookie File / Cookie 檔案`);
          lines.push(`- Filename: \`${cred.filename || "(empty)"}\``);
          lines.push(`- Count: **${cred.count || 0}** cookie(s)`);
          if (cred.domains && cred.domains.length) {
            lines.push(`- Domains: ${cred.domains.map((d) => `\`${d}\``).join(", ")}`);
          }
          if (cred.parseErrors) {
            lines.push(`- ⚠ Parse errors: ${cred.parseErrors} malformed line(s) skipped`);
          }
          if (cred.note) {
            lines.push(`- Note: ${cred.note}`);
          }
          if (cred.parsed && cred.parsed.length) {
            lines.push("");
            lines.push("**As Cookie header** (drop-in for `curl -H` / `fetch`):");
            lines.push("");
            lines.push("```");
            lines.push(cred.as_header);
            lines.push("```");
            lines.push("");
            lines.push("**Parsed cookies:**");
            lines.push("");
            lines.push("| Name | Value | Domain | Path | Secure | HttpOnly | Expires |");
            lines.push("| --- | --- | --- | --- | :---: | :---: | --- |");
            for (const c of cred.parsed) {
              // Escape pipe chars in value to avoid breaking the table
              const safeVal = String(c.value).replace(/\|/g, "\\|");
              const safeName = String(c.name).replace(/\|/g, "\\|");
              const exp = c.session ? "_session_" : String(c.expires);
              lines.push(`| \`${safeName}\` | \`${safeVal}\` | ${c.domain} | ${c.path} | ${c.secure ? "✓" : ""} | ${c.httpOnly ? "✓" : ""} | ${exp} |`);
            }
          }
          break;
      }
    });
  } else {
    lines.push(`- Public — 無需驗證`);
  }
  if (form.technical.notes) {
    lines.push("");
    lines.push("### Notes / 備註");
    lines.push(form.technical.notes);
  }
  return lines.join("\n");
}

/* ============================================================
   Syntax highlighting (minimal)
   ============================================================ */
function highlightJson(src) {
  return src
    .replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))
    .replace(/("(?:\\.|[^"\\])*")(\s*:)/g, '<span class="k">$1</span>$2')
    .replace(/:\s*("(?:\\.|[^"\\])*")/g, ': <span class="s">$1</span>')
    .replace(/\b(true|false|null)\b/g, '<span class="n">$1</span>')
    .replace(/\b(-?\d+\.?\d*)\b/g, '<span class="n">$1</span>');
}
function highlightMd(src) {
  return src
    .replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))
    .replace(/^(#{1,6})\s.*$/gm, '<span class="k">$&</span>')
    .replace(/\*\*([^*]+)\*\*/g, '<span class="k">**$1**</span>')
    .replace(/`([^`]+)`/g, '<span class="s">`$1`</span>')
    .replace(/^-\s/gm, '<span class="c">- </span>');
}

/* ============================================================
   Export Panel
   ============================================================ */
function sanitizeFilename(name) {
  if (!name) return "";
  return String(name)
    .trim()
    .replace(/\.(ya?ml|json|md|txt)$/i, "")   // strip trailing scraper file extensions
    .replace(/[\/\\:*?"<>|]+/g, "")           // strip filesystem-illegal chars
    .replace(/\s+/g, "-")                       // spaces → dashes
    .replace(/-+/g, "-")                        // collapse repeated dashes
    .replace(/^-+|-+$/g, "");                   // trim edge dashes
}

function formatLastSaved(ts) {
  if (!ts) return null;
  const d = new Date(ts);
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function ExportPanel({ form, onToast, onImport, onReset, lastSaved }) {
  const [tab, setTab] = useState("md");
  const md = useMemo(() => toMarkdown(form), [form]);
  const json = useMemo(() => toJson(form), [form]);
  const content = tab === "md" ? md : json;

  const basename = useMemo(() => {
    const clean = sanitizeFilename(form.website?.scraperName);
    return clean ? `${clean}-Scraper-Request` : "Scraper-Request";
  }, [form.website?.scraperName]);
  const filename = tab === "md" ? `${basename}.md` : `${basename}.json`;
  const highlighted = tab === "md" ? highlightMd(content) : highlightJson(content);

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(content);
      onToast("已複製到剪貼簿 / Copied");
    } catch {
      onToast("複製失敗 / Copy failed");
    }
  };
  const download = () => {
    const blob = new Blob([content], { type: tab === "md" ? "text/markdown" : "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    onToast("已下載 / Downloaded");
  };

  const fileRef = React.useRef(null);
  const doImport = () => fileRef.current?.click();
  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        onImport(data);
        onToast("已匯入 / Imported");
      } catch (err) {
        onToast("JSON 格式錯誤 / Invalid JSON");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <section id="export" className="section" data-section="export">
      <div className="sec-head">
        <span className="idx">05</span>
        <h2>匯出 <span className="en">Export</span></h2>
      </div>
      <p className="sec-desc">選擇輸出的格式進行下載，或者複製到剪貼簿進一步處理。也可以匯入之前的工作進行編輯。</p>

      <div className="export">
        <div className="tabs">
          <button type="button" className={"tab" + (tab === "md" ? " on" : "")} onClick={() => setTab("md")}>Markdown</button>
          <button type="button" className={"tab" + (tab === "json" ? " on" : "")} onClick={() => setTab("json")}>JSON</button>
          <div className="tab-spacer" />
          <div className="toolbar">
            <input ref={fileRef} type="file" accept=".json,application/json" style={{ display: "none" }} onChange={handleFile} />
            <button className="icon-btn" onClick={doImport}
              aria-label="匯入 JSON / Import" title="匯入 JSON / Import">
              <svg className="svg-glyph" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 11 L8 3 M4 6 L8 3 L12 6 M3 13 L13 13" />
              </svg>
            </button>
            <button className="icon-btn" onClick={copy}
              aria-label="複製 / Copy" title="複製 / Copy">
              <svg className="svg-glyph" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="5" y="5" width="8" height="8" rx="1.2" />
                <path d="M11 5 L11 3.5 A0.5 0.5 0 0 0 10.5 3 L3.5 3 A0.5 0.5 0 0 0 3 3.5 L3 10.5 A0.5 0.5 0 0 0 3.5 11 L5 11" />
              </svg>
            </button>
            <button className="btn btn-primary" onClick={download} title={`下載 ${filename}`}>
              ↓ 下載 <span className="en">{tab === "md" ? ".MD" : ".JSON"}</span>
            </button>
          </div>
        </div>
        <div className="code-wrap">
          <pre className="code" dangerouslySetInnerHTML={{ __html: highlighted }} />
        </div>
      </div>

      <div className="footer">
        <span>
          {lastSaved
            ? <>草稿於 <b className="ts">{formatLastSaved(lastSaved)}</b> 自動儲存</>
            : "尚未有變更 / No changes yet"}
        </span>
        <div className="actions">
          <ResetButton onReset={onReset} />
        </div>
      </div>
    </section>
  );
}

function ResetButton({ onReset }) {
  const [confirming, setConfirming] = useState(false);
  const timerRef = React.useRef(null);
  const cancel = () => {
    clearTimeout(timerRef.current);
    setConfirming(false);
  };
  const arm = () => {
    setConfirming(true);
    // auto-cancel after 4s
    timerRef.current = setTimeout(() => setConfirming(false), 4000);
  };
  const fire = () => {
    clearTimeout(timerRef.current);
    setConfirming(false);
    onReset?.();
  };
  React.useEffect(() => () => clearTimeout(timerRef.current), []);

  if (!confirming) {
    return (
      <button className="reset-icon-btn" onClick={arm}
        aria-label="清空全部 / Reset all" title="清空全部 / Reset all">
        <span className="glyph">♻</span>
      </button>
    );
  }
  return (
    <div className="reset-confirm">
      <span className="reset-msg">確定要清空？ <span className="en">Confirm reset?</span></span>
      <button className="btn-mini danger" onClick={fire}>清空 / YES</button>
      <button className="btn-mini" onClick={cancel}>取消 / NO</button>
    </div>
  );
}

Object.assign(window, { ExportPanel, toJson, toMarkdown });
</script>
<script type="text/babel">const { useState, useEffect, useMemo, useCallback, useRef } = React;

function App() {
  const [form, setForm, lastSaved] = useDraft();
  const [ToastEl, showToast] = useToast();
  const [activeStep, setActiveStep] = useState("target");

  // Apply defaults (light theme, regular density) once on mount
  useEffect(() => {
    document.documentElement.dataset.theme = "light";
    document.documentElement.dataset.density = "regular";
  }, []);

  // Active step + active DOM section id (for sub-item highlighting).
  // Strategy: IntersectionObserver with a thin horizontal band near the top
  // of the viewport (rootMargin puts the observation zone at roughly y=80..200
  // relative to viewport). Whichever section is crossing that band wins.
  // This behaves correctly across (a) tall sections mid-scroll and (b) short
  // sections that never fill the whole viewport, and re-binds when new
  // scrapers are added.
  const [activeSectionId, setActiveSectionId] = useState("target");

  useEffect(() => {
    const els = Array.from(document.querySelectorAll("section[data-section]"));
    if (!els.length) return;
    // A 40px-tall band roughly 15% from the top of viewport
    const rootMargin = "-15% 0px -80% 0px";
    let lastVisibleId = null;
    const obs = new IntersectionObserver(
      (entries) => {
        // Any section currently crossing the band → that's the active one.
        // If multiple, pick the one with the smallest positive top (closest
        // to the anchor line coming down from above).
        const crossing = entries
          .filter((e) => e.isIntersecting)
          .map((e) => ({ el: e.target, top: e.boundingClientRect.top }))
          .sort((a, b) => Math.abs(a.top) - Math.abs(b.top));
        if (crossing.length > 0) {
          const el = crossing[0].el;
          if (el.id !== lastVisibleId) {
            lastVisibleId = el.id;
            if (el.dataset.section) setActiveStep(el.dataset.section);
            if (el.id) setActiveSectionId(el.id);
          }
        }
      },
      { rootMargin, threshold: [0, 1] }
    );
    els.forEach((el) => obs.observe(el));
    return () => obs.disconnect();
  }, [form.objectTypes.join("|")]);

  // Scroll to a specific DOM id (either a step group's first section, or a
  // specific sub-section like "fields-performer").
  const scrollToId = (id) => {
    const el = document.getElementById(id)
      || document.querySelector(`section[data-section="${id}"]`);
    if (el) {
      const y = el.getBoundingClientRect().top + window.pageYOffset - 24;
      window.scrollTo({ top: y, behavior: "smooth" });
    }
  };

  // validation
  const errors = useMemo(() => {
    const e = {};
    if (form.website.baseUrl && !isUrl(form.website.baseUrl)) {
      e.baseUrl = "請輸入有效的 URL（以 http:// 或 https:// 開頭）";
    }
    return e;
  }, [form.website.baseUrl]);

  // Aggregate helpers — how many scrapers, how many total test cases across all
  const scraperCount = form.objectTypes.length;
  const totalCases = form.objectTypes.reduce(
    (n, t) => n + ((form.scrapers[t]?.testCases || []).length), 0
  );
  const anyFields = form.objectTypes.some((t) => (form.scrapers[t]?.fields || []).length > 0);
  const anyValidCase = form.objectTypes.some((t) =>
    (form.scrapers[t]?.testCases || []).some((c) => isUrl(c.url))
  );

  // step completion
  const done = useMemo(() => ({
    target: !!(form.website.name && form.website.baseUrl && isUrl(form.website.baseUrl) && form.objectTypes.length > 0),
    fields: anyFields,
    cases: anyValidCase,
    tech: true,
    export: false,
  }), [form, anyFields, anyValidCase]);

  // Import: hand off to migrateForm, which handles both v1 (single objectType,
  // top-level fields/testCases) and v2 (objectTypes[], scrapers{}) payloads,
  // including the export-shape variant where the JSON came from ExportPanel
  // (scrapers as array with objectType key rather than a keyed object).
  const handleImport = (data) => {
    // If payload came from JSON export (scrapers: [{objectType, ...}]), fold back
    // into the keyed shape migrateForm expects.
    let payload = data;
    if (Array.isArray(data?.scrapers)) {
      const scrapers = {};
      const objectTypes = [];
      for (const s of data.scrapers) {
        if (!s?.objectType) continue;
        objectTypes.push(s.objectType);
        scrapers[s.objectType] = {
          scraperName: s.scraperName || s.name || "",
          searchPattern: s.searchPattern || "",
          detailPattern: s.detailPattern || "",
          fields: s.fields || [],
          testCases: (s.testCases || []).map((c) => ({
            id: "c" + Math.random().toString(36).slice(2, 9),
            url: c.url || "",
            expected: c.expected || {},
            notes: c.notes || "",
            open: true,
          })),
        };
      }
      payload = { ...data, objectTypes, scrapers };
    }
    setForm(() => migrateForm(payload));
  };

  const handleReset = () => {
    if (!confirm("確定要清空所有內容嗎？此動作無法還原。")) return;
    setForm(emptyForm());
    showToast("已清空 / Cleared");
  };

  const showEn = true;  // English secondary labels always visible in standalone

  return (
    <div className="app">
      <header className="masthead" data-screen-label="masthead">
        <div>
          <div className="brand-chip">
            <span className="dot" />
            <span>https://github.com/daniel-yfc/stash/</span>
          </div>
          <h1>
            Scraper Request Builder
            {showEn && <span className="en" style={{ fontSize: 17 }}>Scraper Request Builder 是一個互動式小工具表單，用來幫助你快速建立 Stash 爬蟲/刮取器(Scarper)。可動態選擇要提取的物件欄位、新增多個測試用的實例，最後一鍵匯出 Markdown 或 JSON，方便爬蟲技能使用或回報問題。</span>}
          </h1>
        </div>
        <p className="lede version">
          <span className="version-date">2026-08-30</span>
          <span className="version-tag">SRB V2.0</span>
        </p>
      </header>

      <div className="layout">
        <div className="stepper-col">
          <nav className="stepper" aria-label="steps">
            {STEPS.map((s, i) => {
              const isMultiStep = (s.id === "fields" || s.id === "cases") && scraperCount > 1;
              // Sub-items only rendered when multi-scraper mode and this step splits
              const subItems = isMultiStep
                ? form.objectTypes.map((typeId, idx) => ({
                    typeId,
                    idx,
                    domId: `${s.id}-${typeId}`,
                    zh: OBJ_MAP[typeId]?.zh || typeId,
                    en: OBJ_MAP[typeId]?.en || typeId,
                    slot: String((idx % 5) + 1),
                  }))
                : [];
              return (
                <div key={s.id} className="step-group">
                  <button type="button"
                    className={"step" + (activeStep === s.id ? " active" : "") + (done[s.id] ? " done" : "")}
                    onClick={() => scrollToId(s.id)}>
                    <span className="num">{done[s.id] && activeStep !== s.id ? (
                      <svg className="svg-glyph" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M3.5 8.5 L6.5 11.5 L12.5 5" />
                      </svg>
                    ) : String(i + 1).padStart(2, "0")}</span>
                    <span className="lbl">
                      {s.zh}
                      {showEn && <span className="en">{s.en}</span>}
                    </span>
                  </button>
                  {subItems.length > 0 && (
                    <div className="step-subs">
                      {subItems.map((sub) => (
                        <button key={sub.domId} type="button"
                          className={"step-sub" + (activeSectionId === sub.domId ? " active" : "")}
                          data-scraper-color={sub.slot}
                          onClick={() => scrollToId(sub.domId)}
                          title={`${sub.zh} / ${sub.en}`}>
                          <span className="rail" aria-hidden="true" />
                          <span className="sub-lbl">
                            <span className="zh">{sub.zh}</span>
                            {showEn && <span className="en">{sub.en}</span>}
                          </span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </nav>
        </div>

        <main className="content">
          <TargetSection form={form} setForm={setForm} errors={errors} showEn={showEn} />
          <FieldsSections form={form} setForm={setForm} showEn={showEn} onToast={showToast} />
          <TestCasesSections form={form} setForm={setForm} showEn={showEn} />
          <TechnicalSection form={form} setForm={setForm} showEn={showEn} onToast={showToast} />
          <ExportPanel form={form} onToast={showToast} onImport={handleImport} onReset={handleReset} lastSaved={lastSaved} />
        </main>
      </div>

      <ToastEl />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);</script>
