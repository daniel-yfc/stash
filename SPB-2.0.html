<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stash 爬蟲請求 · Scraper Request (Single File)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   Stash Scraper Request — Corporate Refined
   Palette: #00338D  #005EB8  #0091DA
   ============================================================ */

:root {
  /* brand */
  --c-brand-900: #00338D;
  --c-brand-700: #005EB8;
  --c-brand-500: #0091DA;

  /* neutrals — light */
  --c-bg: #FBFCFE;
  --c-surface: #FFFFFF;
  --c-surface-2: #F1F4FA;
  --c-border: #D4DBE7;
  --c-border-strong: #A9B4C6;
  --c-text: #05101F;
  --c-text-2: #37425A;
  --c-text-3: #667089;
  --c-danger: #C0392B;
  --c-success: #1E8E5A;

  /* type */
  --f-sans: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Space Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* rhythm */
  --r-1: 4px;
  --r-2: 8px;
  --r-3: 12px;
  --r-4: 16px;
  --r-5: 24px;
  --r-6: 32px;
  --r-7: 48px;
  --r-8: 64px;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  /* motion */
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}

/* dark theme override */
[data-theme="dark"] {
  --c-bg: #0A1428;
  --c-surface: #0F1B33;
  --c-surface-2: #142240;
  --c-border: #1E2E4F;
  --c-border-strong: #2A3D63;
  --c-text: #EAF0FA;
  --c-text-2: #A6B4CC;
  --c-text-3: #6C7D9C;
  --c-brand-500: #33A9E5;
}

/* density */
[data-density="cozy"]    { --gap-y: 16px; --field-pad: 11px 13px; }
[data-density="regular"] { --gap-y: 22px; --field-pad: 13px 14px; }
[data-density="airy"]    { --gap-y: 28px; --field-pad: 15px 16px; }

/* ------------------------------------------------------------------ */
/* base */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--f-sans);
  color: var(--c-text);
  background: var(--c-bg);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 320px;
  pointer-events: none;
  background-image:
    radial-gradient(circle at 1px 1px,
      color-mix(in oklab, var(--c-brand-900) 100%, transparent) 1px,
      transparent 0);
  background-size: 28px 28px;
  opacity: .08;
  z-index: 0;
  mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
}
[data-theme="dark"] body::before {
  opacity: .15;
  background-image:
    radial-gradient(circle at 1px 1px, var(--c-brand-500) 1px, transparent 0);
}

/* ------------------------------------------------------------------ */
/* layout */
.app {
  position: relative;
  z-index: 1;
  max-width: 1240px;
  margin: 0 auto;
  padding: var(--r-7) var(--r-6) var(--r-8);
}

.masthead {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: var(--r-7);
  padding-bottom: var(--r-6);
  border-bottom: 1px solid var(--c-border);
  margin-bottom: var(--r-7);
}
.masthead .brand-chip {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--c-brand-900);
  font-weight: 700;
  margin-bottom: 18px;
}
[data-theme="dark"] .masthead .brand-chip { color: var(--c-brand-500); }
.masthead .brand-chip .dot {
  width: 8px; height: 8px; border-radius: 2px;
  background: var(--c-brand-900);
  box-shadow: 12px 0 0 var(--c-brand-700), 24px 0 0 var(--c-brand-500);
  margin-right: 22px;
}
.masthead h1 {
  font-size: 52px;
  font-weight: 500;
  letter-spacing: -0.025em;
  margin: 0;
  line-height: 1.05;
}
.masthead h1 .en {
  display: block;
  font-family: var(--f-mono);
  font-size: 13px;
  font-weight: 400;
  letter-spacing: .06em;
  color: var(--c-text-2);
  margin-top: 12px;
  text-transform: none;
}
.masthead .lede {
  max-width: 360px;
  color: var(--c-text-2);
  font-size: 15px;
  line-height: 1.65;
  padding-left: var(--r-5);
  border-left: 2px solid var(--c-brand-500);
  margin: 0;
}
.masthead .lede .en {
  display: block;
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--c-text-3);
  margin-top: 8px;
  line-height: 1.55;
}

/* Version block — replaces prose lede when this is a versioned spec */
.masthead .lede.version {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  min-width: 200px;
}
.masthead .lede.version .version-date {
  font-family: var(--f-mono);
  font-size: 20px;
  font-weight: 700;
  color: #2B55B1;
  letter-spacing: .04em;
  line-height: 1.1;
}
.masthead .lede.version .version-tag {
  font-family: var(--f-mono);
  font-size: 12px;
  font-weight: 700;
  color: #2B55B1;
  letter-spacing: .12em;
  text-transform: uppercase;
  opacity: .8;
}
[data-theme="dark"] .masthead .lede.version .version-date,
[data-theme="dark"] .masthead .lede.version .version-tag { color: #6B8BD9; }

/* ------------------------------------------------------------------ */
/* layout grid */
.layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: var(--r-7);
  align-items: start;
}

/* ------------------------------------------------------------------ */
/* stepper column (wrapper — sticky) */
.stepper-col {
  position: sticky;
  top: var(--r-5);
  align-self: start;
  display: flex;
  flex-direction: column;
}

/* stepper (main navigable steps) */
.stepper {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 0;
  position: relative;
}
.stepper::before {
  content: "";
  position: absolute;
  left: 27px;
  top: 40px;
  bottom: 40px;
  width: 1px;
  background: var(--c-border);
  z-index: 0;
}

/* aside: test-case counter (below the main stepper, no connector line) */
.step-counter {
  display: grid;
  grid-template-columns: 36px 1fr;
  align-items: center;
  gap: 12px;
  padding: 10px 10px;
  margin-top: 20px;
  border: none;
  border-top: 1px dashed var(--c-border);
  padding-top: 20px;
  background: transparent;
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: var(--c-text-2);
  border-radius: 0 0 var(--radius-md) var(--radius-md);
  transition: color .18s var(--ease);
}
.step-counter:hover { color: var(--c-text); }
.step-counter .num {
  font-family: var(--f-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--c-brand-700);
  width: 32px;
  height: 32px;
  border: 1.5px solid var(--c-brand-700);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: color-mix(in oklab, var(--c-brand-500) 8%, var(--c-surface));
  transition: all .18s var(--ease);
}
.step-counter:hover .num {
  background: color-mix(in oklab, var(--c-brand-500) 16%, var(--c-surface));
}
[data-theme="dark"] .step-counter .num { color: var(--c-brand-500); border-color: var(--c-brand-500); }
.step-counter .lbl {
  display: block;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.step-counter .lbl .en {
  display: block;
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .04em;
  color: var(--c-text-3);
  margin-top: 3px;
  text-transform: uppercase;
}
.stepper .step {
  display: grid;
  grid-template-columns: 36px 1fr;
  align-items: center;
  gap: 12px;
  padding: 10px 10px;
  border-radius: var(--radius-md);
  cursor: pointer;
  color: var(--c-text-2);
  transition: background .18s var(--ease), color .18s var(--ease);
  border: none;
  background: transparent;
  text-align: left;
  font: inherit;
  width: 100%;
  position: relative;
  z-index: 1;
}
.stepper .step:hover {
  background: var(--c-surface-2);
  color: var(--c-text);
}
.stepper .step .num {
  font-family: var(--f-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--c-text-2);
  width: 32px;
  height: 32px;
  border: 1.5px solid var(--c-border-strong);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all .18s var(--ease);
  background: var(--c-surface);
}
.stepper .step .lbl {
  display: block;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.stepper .step .lbl .en {
  display: block;
  font-family: var(--f-mono);
  font-size: 11.5px;
  font-weight: 400;
  letter-spacing: .04em;
  color: var(--c-text-2);
  margin-top: 3px;
  text-transform: uppercase;
}
.stepper .step.active {
  background: var(--c-surface);
  color: var(--c-text);
  box-shadow: inset 0 0 0 1px var(--c-border);
}
.stepper .step.active .num {
  background: var(--c-brand-900);
  border-color: var(--c-brand-900);
  color: #fff;
}
.stepper .step.done .num {
  background: var(--c-brand-500);
  border-color: var(--c-brand-500);
  color: #fff;
}
[data-theme="dark"] .stepper .step.done .num { background: var(--c-brand-500); }

/* ------------------------------------------------------------------ */
/* Step group + sub-items — for multi-scraper mode                    */
/* Each fields/cases step can expand into per-objectType sub-items    */
/* below it. Sub-items get the scraper accent color as a left rail.   */
/* ------------------------------------------------------------------ */
.step-group {
  display: flex;
  flex-direction: column;
}
.step-subs {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin: 2px 0 6px 46px;   /* align rail under the .num circle center-ish */
  padding-left: 2px;
}
.step-sub {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 6px 0;
  border: none;
  background: transparent;
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: var(--c-text-2);
  transition: color .15s var(--ease), background .15s var(--ease);
  border-radius: 4px;
  width: 100%;
  position: relative;
}
.step-sub .rail {
  width: 3px;
  height: 22px;
  border-radius: 2px;
  background: var(--c-scr-accent, var(--c-border-strong));
  flex-shrink: 0;
  opacity: .55;
  transition: opacity .15s var(--ease), width .15s var(--ease);
}
.step-sub .sub-lbl {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.step-sub .sub-lbl .zh {
  font-size: 13px;
  font-weight: 500;
  color: inherit;
  letter-spacing: -0.005em;
}
.step-sub .sub-lbl .en {
  display: block;
  font-family: var(--f-mono);
  font-size: 10.5px;
  font-weight: 400;
  letter-spacing: .04em;
  color: var(--c-text-3);
  margin-top: 1px;
  text-transform: uppercase;
}
.step-sub:hover {
  color: var(--c-text);
  background: var(--c-surface-2);
}
.step-sub:hover .rail { opacity: .85; }
.step-sub.active {
  color: var(--c-text);
  background: color-mix(in oklab, var(--c-scr-accent) 8%, var(--c-surface));
}
.step-sub.active .rail {
  opacity: 1;
  width: 4px;
  height: 26px;
}
.step-sub.active .sub-lbl .zh { color: var(--c-scr-accent); font-weight: 600; }
[data-theme="dark"] .step-sub.active {
  background: color-mix(in oklab, var(--c-scr-accent) 18%, var(--c-surface));
}

/* Mobile horizontal stepper: hide sub-items (nav becomes too wide) */
@media (max-width: 900px) {
  .step-subs { display: none; }
}

/* ------------------------------------------------------------------ */
/* content sections */
.content { display: flex; flex-direction: column; gap: var(--r-7); min-width: 0; }

.section {
  scroll-margin-top: var(--r-5);
  padding: var(--r-6) var(--r-6) var(--r-6);
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  position: relative;
}
.section::before {
  content: "";
  position: absolute;
  top: -1px;
  left: -1px;
  width: 4px;
  height: 40px;
  background: var(--c-brand-900);
  border-radius: var(--radius-lg) 0 0 0;
}
[data-theme="dark"] .section::before { background: var(--c-brand-500); }
.section .sec-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: var(--r-5);
  padding-bottom: 14px;
  border-bottom: 1px solid var(--c-border);
}
.section .sec-head .idx {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--c-brand-700);
  letter-spacing: .1em;
  font-weight: 700;
}
[data-theme="dark"] .section .sec-head .idx { color: var(--c-brand-500); }
.section .sec-head h2 {
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.015em;
  margin: 0;
}
.section .sec-head h2 .en {
  font-family: var(--f-mono);
  font-size: 12.5px;
  font-weight: 400;
  color: var(--c-text-2);
  margin-left: 12px;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.section .sec-head .idx { font-size: 13px; }
.section .sec-desc {
  color: var(--c-text-2);
  font-size: 14.5px;
  margin: -8px 0 var(--r-5);
  max-width: 640px;
  line-height: 1.6;
}

/* ------------------------------------------------------------------ */
/* form controls */
.field { display: block; margin-bottom: var(--gap-y); }
.field .label {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  color: var(--c-text);
  margin-bottom: 8px;
}
.field .label .en {
  font-family: var(--f-mono);
  font-size: 12px;
  font-weight: 400;
  color: var(--c-text-2);
  letter-spacing: .04em;
}
.field .label .req {
  color: var(--c-brand-700);
  font-family: var(--f-mono);
  font-size: 14px;
  font-weight: 700;
}
.field .hint {
  display: block;
  margin-top: 8px;
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--c-text-2);
  letter-spacing: .02em;
}
.field .err {
  display: block;
  margin-top: 8px;
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--c-danger);
  letter-spacing: .02em;
  font-weight: 600;
}

.input,
.textarea,
.select {
  width: 100%;
  font-family: var(--f-sans);
  font-size: 15.5px;
  color: var(--c-text);
  background: var(--c-surface);
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius-sm);
  padding: var(--field-pad);
  transition: border-color .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease);
  appearance: none;
  -webkit-appearance: none;
}
.input::placeholder,
.textarea::placeholder {
  color: var(--c-text-3);
  font-family: var(--f-mono);
  font-size: 14px;
}
.input:hover, .textarea:hover, .select:hover {
  border-color: var(--c-border-strong);
}
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--c-brand-500);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--c-brand-500) 20%, transparent);
  background: var(--c-surface);
}
.input.mono, .textarea.mono { font-family: var(--f-mono); font-size: 14.5px; }
.input[aria-invalid="true"] {
  border-color: var(--c-danger);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--c-danger) 15%, transparent);
}
.textarea { resize: vertical; min-height: 88px; line-height: 1.55; }

.select {
  padding-right: 36px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%234A5468' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 14px center;
}

/* grid rows */
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 780px) {
  .row, .row-3 { grid-template-columns: 1fr; }
}

/* segmented control for object type */
.segmented {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.segmented .seg {
  border: 1.5px solid var(--c-border);
  background: var(--c-surface);
  padding: 14px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: var(--f-sans);
  color: var(--c-text);
  transition: all .15s var(--ease);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.segmented .seg:hover {
  border-color: var(--c-border-strong);
  color: var(--c-text);
}
.segmented .seg.on {
  border-color: var(--c-brand-900);
  background: color-mix(in oklab, var(--c-brand-900) 8%, var(--c-surface));
  color: var(--c-brand-900);
  box-shadow: inset 0 0 0 1.5px var(--c-brand-900);
}
[data-theme="dark"] .segmented .seg.on {
  background: color-mix(in oklab, var(--c-brand-500) 15%, var(--c-surface));
  color: var(--c-brand-500);
  border-color: var(--c-brand-500);
  box-shadow: inset 0 0 0 1px var(--c-brand-500);
}
.segmented .seg .zh { font-weight: 600; font-size: 15px; }
.segmented .seg .en {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: inherit;
  opacity: .8;
}
@media (max-width: 780px) { .segmented { grid-template-columns: repeat(2, 1fr); } }

/* field checkbox grid */
.checks {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}
.checkline {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius-sm);
  background: var(--c-surface);
  cursor: pointer;
  transition: all .12s var(--ease);
  font-size: 15px;
}
.checkline:hover { border-color: var(--c-border-strong); }
.checkline.on {
  border-color: var(--c-brand-700);
  background: color-mix(in oklab, var(--c-brand-500) 6%, var(--c-surface));
}
[data-theme="dark"] .checkline.on {
  background: color-mix(in oklab, var(--c-brand-500) 12%, var(--c-surface));
}
.checkline input {
  appearance: none;
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border: 2px solid var(--c-border-strong);
  border-radius: 4px;
  display: inline-flex;
  align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: all .12s var(--ease);
}
.checkline input:checked {
  background: var(--c-brand-700);
  border-color: var(--c-brand-700);
}
.checkline input:checked::after {
  content: "";
  width: 8px; height: 4px;
  border-left: 1.5px solid #fff;
  border-bottom: 1.5px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}
.checkline .zh { font-weight: 600; }
.checkline .en {
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--c-text-2);
  margin-left: 4px;
}
.checkline.disabled {
  opacity: .55;
  cursor: not-allowed;
}
.checkline.disabled input { cursor: not-allowed; }
.checkline.disabled:hover { border-color: var(--c-border); }

/* Per-scraper section tag — the "· Scene" suffix next to section H2s */
.sec-head h2 .scr-tag {
  color: var(--c-brand-700);
  font-weight: 600;
}
[data-theme="dark"] .sec-head h2 .scr-tag { color: var(--c-brand-500); }

/* "Copy from previous scraper" row — sits below the two pattern inputs */
.copy-prev-row {
  margin-top: -8px;
  margin-bottom: var(--r-4);
  display: flex;
  justify-content: flex-end;
}
.copy-prev-row .btn {
  font-size: 13px;
  padding: 4px 12px;
}
.copy-prev-row .btn .en {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--c-text-2);
  margin-left: 8px;
  letter-spacing: .04em;
  text-transform: uppercase;
}

/* Small variant of .btn — for inline actions */
.btn.btn-sm {
  padding: 6px 14px;
  font-size: 13px;
}

/* ============================================================
   Per-scraper color coding
   ============================================================
   Fields + Test-Cases sections in multi-scraper mode get a
   data-scraper-color="1..5" attr assigned by objectTypes order
   (1st checked = 1, 2nd = 2, ...). 5 slots cover 5 object types.
   These vars are ISOLATED from --c-brand-*  so the primary CTA,
   focus ring, top-of-page masthead, and design system semantics
   remain untouched. Only rail / index label / .scr-tag / checkbox
   on-state inherit the scraper color.

   Light theme uses the Main palette (from user).
   Dark theme flips to the brighter Light palette so it stays
   legible on the dark navy canvas — same discipline as
   --c-brand-500 → #33A9E5 in the existing dark override.
*/
:root {
  --c-scraper-1: #00338D;   /* Main deep — 1st selected objectType */
  --c-scraper-2: #1E49E2;   /* Main royal blue — 2nd */
  --c-scraper-3: #005EB8;   /* Main mid — 3rd */
  --c-scraper-4: #0099DD;   /* Main bright — 4th */
  --c-scraper-5: #0091DA;   /* Light fallback — 5th (rarely used) */
}
[data-theme="dark"] {
  --c-scraper-1: #0276C5;
  --c-scraper-2: #0091DA;
  --c-scraper-3: #00B8F5;
  --c-scraper-4: #ACEAFF;
  --c-scraper-5: #ACEAFF;
}

/* Per-slot cascade. Each slot re-points a local --c-scr-accent var
   which the section-scoped rules read from. Doing it this way means
   we only write the 4 rule-groups ONCE — the slot-specific rules
   are just var reassignment. */
[data-scraper-color="1"] { --c-scr-accent: var(--c-scraper-1); }
[data-scraper-color="2"] { --c-scr-accent: var(--c-scraper-2); }
[data-scraper-color="3"] { --c-scr-accent: var(--c-scraper-3); }
[data-scraper-color="4"] { --c-scraper-4-active: var(--c-scraper-4); --c-scr-accent: var(--c-scraper-4); }
[data-scraper-color="5"] { --c-scr-accent: var(--c-scraper-5); }

/* Apply scraper accent to the four visual anchors:
     - top-left 4×40px rail
     - "02"/"03" index label
     - "· 場景" tag on the h2
     - checked field checkbox (fill + border)
   In single-scraper mode (no data-scraper-color attr) the fallback
   remains the original brand palette values. */
.section[data-scraper-color] .sec-head .idx {
  color: var(--c-scr-accent);
}
.section[data-scraper-color] .sec-head h2 .scr-tag {
  color: var(--c-scr-accent);
}
.section[data-scraper-color]::before {
  background: var(--c-scr-accent);
}
.section[data-scraper-color] .checkline.on {
  border-color: var(--c-scr-accent);
  background: color-mix(in oklab, var(--c-scr-accent) 8%, var(--c-surface));
}
.section[data-scraper-color] .checkline input:checked {
  background: var(--c-scr-accent);
  border-color: var(--c-scr-accent);
}
/* Dark theme: bump the "on" tint a bit for legibility on navy */
[data-theme="dark"] .section[data-scraper-color] .checkline.on {
  background: color-mix(in oklab, var(--c-scr-accent) 16%, var(--c-surface));
}

/* test case */
.case {
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  background: var(--c-surface);
  margin-bottom: 14px;
  overflow: hidden;
  transition: box-shadow .18s var(--ease);
}
.case:hover { box-shadow: 0 1px 0 var(--c-border-strong); }
.case .case-hd {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid transparent;
}
.case[data-open="true"] .case-hd { border-bottom-color: var(--c-border); }
.case .case-hd .caret {
  width: 12px; height: 12px;
  border-right: 1.5px solid var(--c-text-2);
  border-bottom: 1.5px solid var(--c-text-2);
  transform: rotate(-45deg);
  transition: transform .2s var(--ease);
  flex-shrink: 0;
}
.case[data-open="true"] .case-hd .caret { transform: rotate(45deg); }
.case .case-hd .title {
  font-weight: 600;
  font-size: 15px;
  color: var(--c-text);
}
.case .case-hd .url-preview {
  flex: 1;
  font-family: var(--f-mono);
  font-size: 13px;
  color: var(--c-text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.case .case-hd .badge {
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--c-surface-2);
  color: var(--c-text-2);
  letter-spacing: .04em;
  text-transform: uppercase;
}

.case .case-hd .note-flag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: color-mix(in oklab, var(--c-brand-500) 12%, var(--c-surface));
  color: var(--c-brand-700);
  border: 1px solid color-mix(in oklab, var(--c-brand-500) 40%, transparent);
  font-family: var(--f-mono);
  font-size: 12px;
  line-height: 1;
  flex-shrink: 0;
}
[data-theme="dark"] .case .case-hd .note-flag {
  color: var(--c-brand-500);
  background: color-mix(in oklab, var(--c-brand-500) 22%, var(--c-surface));
}

/* Case notes textarea — visually separated from other fields */
.case-body .case-notes-field {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px dashed var(--c-border);
}
.case-body .case-notes-field .textarea {
  min-height: 68px;
  font-size: 14px;
  background: var(--c-surface-2);
}
.case-body .case-notes-field .textarea:focus {
  background: var(--c-surface);
}
.case .case-hd .badge.ok { color: var(--c-brand-700); background: color-mix(in oklab, var(--c-brand-500) 10%, transparent); }
.case .case-hd .badge.warn { color: var(--c-danger); background: color-mix(in oklab, var(--c-danger) 10%, transparent); }
.case .case-hd .remove {
  background: none;
  border: none;
  padding: 7px 10px;
  cursor: pointer;
  color: var(--c-text-2);
  font-family: var(--f-mono);
  font-size: 12px;
  font-weight: 700;
  border-radius: 4px;
  transition: all .12s var(--ease);
}
.case .case-hd .remove:hover { background: color-mix(in oklab, var(--c-danger) 10%, transparent); color: var(--c-danger); }
.case .case-body {
  padding: 16px;
  display: none;
}
.case[data-open="true"] .case-body { display: block; }

.case-body .url-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  margin-bottom: 18px;
}
.case-body .url-row .field { flex: 1; margin: 0; }
.case-body .url-row .open-link {
  font-family: var(--f-mono);
  font-size: 13px;
  font-weight: 700;
  padding: 12px 16px;
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius-sm);
  color: var(--c-text);
  text-decoration: none;
  background: var(--c-surface);
  white-space: nowrap;
  transition: all .12s var(--ease);
  letter-spacing: .04em;
}
.case-body .url-row .open-link:hover {
  border-color: var(--c-brand-700);
  color: var(--c-brand-700);
}
.case-body .url-row .open-link[aria-disabled="true"] {
  opacity: .4; pointer-events: none;
}

.expected-grid {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 10px 16px;
  align-items: center;
}
.expected-grid .k {
  font-family: var(--f-sans);
  font-size: 14.5px;
  font-weight: 600;
  color: var(--c-text);
  letter-spacing: -0.005em;
}
.expected-grid .k .en {
  display: block;
  font-family: var(--f-mono);
  font-size: 11.5px;
  font-weight: 400;
  color: var(--c-text-2);
  margin-top: 3px;
}
.expected-grid input {
  padding: 10px 12px;
  font-size: 14.5px;
  background: var(--c-surface-2);
  border: 1.5px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--c-text);
  font-family: var(--f-sans);
  transition: all .12s var(--ease);
}
.expected-grid input:hover { border-color: var(--c-border); background: var(--c-surface); }
.expected-grid input:focus {
  outline: none;
  border-color: var(--c-brand-500);
  background: var(--c-surface);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--c-brand-500) 18%, transparent);
}
@media (max-width: 720px) { .expected-grid { grid-template-columns: 1fr; gap: 4px 0; } }

/* add case */
.add-case {
  width: 100%;
  padding: 18px;
  border: 2px dashed var(--c-border-strong);
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--c-text);
  font-family: var(--f-sans);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s var(--ease);
}
.add-case:hover {
  border-color: var(--c-brand-700);
  color: var(--c-brand-700);
  background: color-mix(in oklab, var(--c-brand-500) 5%, transparent);
}
.add-case .en { font-family: var(--f-mono); font-size: 12px; margin-left: 10px; color: var(--c-text-2); font-weight: 400; }
.add-case:hover .en { color: var(--c-brand-700); }

/* ------------------------------------------------------------------ */
/* buttons */
.btn {
  font-family: var(--f-sans);
  font-size: 14.5px;
  font-weight: 600;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: all .15s var(--ease);
  display: inline-flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.005em;
}
.btn .en { font-family: var(--f-mono); font-size: 12px; font-weight: 400; opacity: .85; letter-spacing: .04em; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.btn-primary {
  background: var(--c-brand-900);
  color: #fff;
}
.btn-primary:hover:not(:disabled) { background: var(--c-brand-700); }

.btn-secondary {
  background: var(--c-surface);
  color: var(--c-text);
  border-color: var(--c-border);
}
.btn-secondary:hover:not(:disabled) {
  border-color: var(--c-brand-700);
  color: var(--c-brand-700);
}

.btn-ghost {
  background: transparent;
  color: var(--c-text-2);
}
.btn-ghost:hover:not(:disabled) { color: var(--c-text); background: var(--c-surface-2); }

.btn-danger-ghost {
  background: transparent;
  color: var(--c-text-3);
}
.btn-danger-ghost:hover:not(:disabled) { color: var(--c-danger); background: color-mix(in oklab, var(--c-danger) 8%, transparent); }

/* ------------------------------------------------------------------ */
/* export panel */
.export {
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  background: var(--c-surface);
  overflow: hidden;
}
.export .tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--c-border);
  background: var(--c-surface-2);
  padding: 0 4px;
}
.export .tab {
  flex-shrink: 0;
  padding: 16px 24px;
  background: transparent;
  border: none;
  cursor: pointer;
  font-family: var(--f-mono);
  font-size: 13.5px;
  font-weight: 700;
  color: var(--c-text-2);
  letter-spacing: .06em;
  text-transform: uppercase;
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
  transition: color .15s var(--ease);
}
.export .tab:hover { color: var(--c-text); }
.export .tab.on {
  color: var(--c-brand-900);
  border-bottom-color: var(--c-brand-900);
  background: var(--c-surface);
}
[data-theme="dark"] .export .tab.on { color: var(--c-brand-500); border-bottom-color: var(--c-brand-500); }

.export .tab-spacer { flex: 1; }
.export .toolbar {
  display: flex;
  gap: 6px;
  padding: 8px 8px 8px 0;
  align-items: center;
}
.export .code-wrap {
  position: relative;
  max-height: 480px;
  overflow: auto;
  background: var(--c-surface-2);
}
[data-theme="dark"] .export .code-wrap { background: #060E1F; }
.export pre.code {
  margin: 0;
  padding: 24px 28px;
  font-family: var(--f-mono);
  font-size: 14px;
  line-height: 1.75;
  color: var(--c-text);
  white-space: pre;
  min-width: max-content;
}
.export .code-empty {
  padding: 48px 24px;
  text-align: center;
  color: var(--c-text-3);
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: .04em;
}

/* syntax hints */
.code .k { color: var(--c-brand-900); font-weight: 600; }
.code .s { color: var(--c-brand-700); }
.code .n { color: var(--c-brand-500); }
.code .c { color: var(--c-text-3); }
[data-theme="dark"] .code .k { color: var(--c-brand-500); }
[data-theme="dark"] .code .s { color: #7EC3EA; }

/* toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--c-text);
  color: var(--c-bg);
  font-family: var(--f-mono);
  font-size: 13px;
  font-weight: 700;
  padding: 12px 22px;
  border-radius: 30px;
  letter-spacing: .04em;
  opacity: 0;
  transition: all .25s var(--ease);
  z-index: 9999;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* footer */
.footer {
  display: flex;
  gap: 12px;
  justify-content: space-between;
  align-items: center;
  padding-top: var(--r-6);
  margin-top: var(--r-6);
  border-top: 1px solid var(--c-border);
  color: var(--c-text-2);
  font-family: var(--f-mono);
  font-size: 12.5px;
  letter-spacing: .04em;
}
.footer .actions { display: flex; gap: 8px; }

/* ------------------------------------------------------------------ */
/* Toggle — checkbox row with expandable body */
.toggle {
  border-radius: var(--radius-sm);
}
.toggle .toggle-hd {
  display: grid;
  grid-template-columns: 24px 1fr;
  align-items: start;
  gap: 14px;
  width: 100%;
  padding: 8px 0;
  background: transparent;
  border: none;
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: var(--c-text);
}
.toggle .toggle-check {
  width: 22px; height: 22px;
  border: 2px solid var(--c-border-strong);
  border-radius: 5px;
  background: var(--c-surface);
  display: inline-flex;
  align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
  transition: all .12s var(--ease);
}
.toggle .toggle-hd:hover .toggle-check { border-color: var(--c-brand-500); }
.toggle .toggle-check.on {
  background: var(--c-brand-700);
  border-color: var(--c-brand-700);
}
.toggle .toggle-check .check-mark {
  width: 10px; height: 5px;
  border-left: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}
.toggle .toggle-lbl { display: flex; flex-direction: column; gap: 3px; }
.toggle .toggle-zh { font-size: 15px; font-weight: 600; color: var(--c-text); }
.toggle .toggle-en {
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--c-text-2);
  letter-spacing: .04em;
}
.toggle .toggle-hint {
  font-family: var(--f-mono);
  font-size: 11.5px;
  color: var(--c-text-3);
  margin-top: 4px;
  letter-spacing: .02em;
}
.toggle .toggle-body {
  margin-top: 18px;
  padding: 20px 22px;
  background: var(--c-surface-2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--c-border);
  display: flex;
  flex-direction: column;
  gap: var(--r-4);
}

/* radio list — used inside rendering type picker */
.radio-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}
.radio-line {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius-sm);
  background: var(--c-surface);
  cursor: pointer;
  font-size: 14px;
  transition: all .12s var(--ease);
}
.radio-line:hover { border-color: var(--c-border-strong); }
.radio-line.on {
  border-color: var(--c-brand-700);
  background: color-mix(in oklab, var(--c-brand-500) 6%, var(--c-surface));
}
.radio-line input[type=radio] {
  appearance: none; -webkit-appearance: none;
  width: 16px; height: 16px;
  border: 2px solid var(--c-border-strong);
  border-radius: 50%;
  flex-shrink: 0;
  transition: all .12s var(--ease);
  position: relative;
}
.radio-line input[type=radio]:checked {
  border-color: var(--c-brand-700);
}
.radio-line input[type=radio]:checked::after {
  content: "";
  position: absolute; inset: 3px;
  border-radius: 50%;
  background: var(--c-brand-700);
}
.radio-line .zh { font-weight: 500; }
.radio-line .en {
  font-family: var(--f-mono);
  font-size: 11.5px;
  color: var(--c-text-2);
  margin-left: 2px;
}

/* callout — a small tinted info box within toggle-body */
.callout {
  padding: 12px 16px;
  background: color-mix(in oklab, var(--c-brand-500) 5%, var(--c-surface));
  border-left: 3px solid var(--c-brand-500);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--c-text);
}
.callout b {
  font-family: var(--f-mono);
  font-weight: 700;
  color: var(--c-brand-900);
  margin-right: 2px;
  letter-spacing: .02em;
}
[data-theme="dark"] .callout b { color: var(--c-brand-500); }
.callout code {
  font-family: var(--f-mono);
  font-size: 12.5px;
  padding: 1px 6px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 4px;
}
.callout .ex {
  margin-top: 8px;
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--c-text-2);
}

/* (old security-note duplicated — moved to bottom "auth method" block) */
.security-note .lock {
  font-family: var(--f-mono);
  font-size: 15px;
  color: #B8860B;
  align-self: start;
  margin-top: 1px;
}
.security-note b {
  font-family: var(--f-mono);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 4px;
  color: #8B6914;
}
[data-theme="dark"] .security-note {
  background: color-mix(in oklab, #F4B400 12%, var(--c-surface));
  border-color: color-mix(in oklab, #F4B400 50%, var(--c-border));
}
[data-theme="dark"] .security-note b { color: #E8C46B; }

/* File slot for cookie upload */

  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 20px;
  border: 2px dashed var(--c-border-strong);
  border-radius: var(--radius-sm);
  background: transparent;
  cursor: pointer;
  color: var(--c-text-2);
  font-family: var(--f-sans);

  transition: all .15s var(--ease);

  font-size: 22px;

  letter-spacing: .06em;

  background: var(--c-surface);

<script type="text/babel">/* global React, ReactDOM */
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================================================
   Field maps — mirror original template exactly
   ============================================================ */
const OBJECT_TYPES = [
  { id: "scene", zh: "場景", en: "Scene" },
  { id: "performer", zh: "演出者", en: "Performer" },
  { id: "group", zh: "合集", en: "Group" },
  { id: "studio", zh: "製作商", en: "Studio" },
  { id: "tag", zh: "標籤", en: "Tag" },
];

/* Lookup helpers — used everywhere so we don't repeat OBJECT_TYPES.find() */
const OBJ_MAP = Object.fromEntries(OBJECT_TYPES.map((o) => [o.id, o]));
const objectLabel = (id, lang = "zh") => OBJ_MAP[id]?.[lang] || id;

const FIELD_MAP = {
  scene: [
    ["Title", "標題"], ["Code", "編號"], ["Date", "日期"], ["Details", "詳情"],
    ["Image", "圖片"], ["Performers", "演出者"], ["Groups", "合集"],
    ["Studio", "製作商"], ["Tags", "標籤"], ["URLs", "網址"],
  ],
  performer: [
    ["Name", "姓名"], ["Aliases", "別名"], ["Gender", "性別"], ["Country", "國家"],
    ["Ethnicity", "種族"], ["Height", "身高"], ["Weight", "體重"],
    ["PenisLength", "陰莖長度"], ["URLs", "網址"],
  ],
  group: [
    ["Name", "名稱"], ["Aliases", "別名"], ["Date", "日期"], ["Studio", "製作商"],
    ["Duration", "時長"], ["Synopsis", "簡介"], ["FrontImage", "封面"],
    ["BackImage", "封底"], ["URLs", "網址"], ["Tags", "標籤"],
  ],
  studio: [
    ["Name", "名稱"], ["Aliases", "別名"], ["Details", "詳情"],
    ["Tags", "標籤"], ["URL", "網址"],
  ],
  tag: [ ["Name", "名稱"] ],
};

const STEPS = [
  { id: "target", zh: "目標", en: "Target" },
  { id: "fields", zh: "欄位", en: "Fields" },
  { id: "cases",  zh: "測試", en: "Test Cases" },
  { id: "tech",   zh: "技術", en: "Technical" },
  { id: "export", zh: "匯出", en: "Export" },
];

const STORAGE_KEY = "stash-scraper-request-draft-v1";

/* ============================================================
   Data model (v2)
   ============================================================
   {
     objectTypes: ["scene", "performer"],  // NEW: multi-select
     website: {                             // shared across all scrapers
       name, baseUrl, scraperName           // scraperName = global base for per-scraper name fallback
     },                                     // NOTE: searchPattern + detailPattern moved into per-scraper block
     scrapers: {                            // NEW: keyed by objectType id
       scene: {
         scraperName: "",                   // per-scraper name; empty → "{global scraperName} {object en}"
         searchPattern: "",                 // moved from website
         detailPattern: "",                 // moved from website
         fields: ["Title", ...],
         testCases: [ makeCase(), ... ]
       },
       ...
     },
     technical: { ... }                     // shared, unchanged
   }
*/

const emptyScraperFor = (objectType) => {
  const fieldList = FIELD_MAP[objectType] || [];
  return {
    scraperName: "",
    searchPattern: "",
    detailPattern: "",
    fields: fieldList.length ? [fieldList[0][0]] : [],
    testCases: [makeCase()],
  };
};

const emptyForm = () => ({
  objectTypes: ["scene"],
  website: { name: "", baseUrl: "", scraperName: "" },
  scrapers: { scene: emptyScraperFor("scene") },
  technical: {
    rendering: { dynamic: false, type: "", detail: "" },
    pagination: { required: false, detail: "" },
    authentication: {
      required: false,
      methods: [],
      access_token: { value: "" },
      api_key_extraction: { sourceUrl: "", regex: "", targetHeader: "" },
      cookie_header: { value: "" },
      api_key_header: { name: "", value: "" },
      cookie_file: { filename: "" },  // content lives in memory only (window.__stashSecrets)
    },
    notes: "",
  },
});

function makeCase() {
  return { id: "c" + Math.random().toString(36).slice(2, 9), url: "", expected: {}, notes: "", open: true };
}

const isUrl = (s) => /^https?:\/\/[^\s]+$/i.test((s || "").trim());

/* ============================================================
   Resolve per-scraper name for export.
   Rule: if scrapers[type].scraperName is filled, use it verbatim.
   Otherwise fall back to "{website.scraperName} {objectType.en} scraper"
   (or just "{objectType.en} scraper" if global name is empty).
*/
function resolveScraperName(form, objectTypeId) {
  const per = form.scrapers?.[objectTypeId]?.scraperName?.trim();
  if (per) return per;
  const globalBase = (form.website?.scraperName || "").trim();
  const objEn = OBJ_MAP[objectTypeId]?.en || objectTypeId;
  return globalBase
    ? `${globalBase} ${objEn.toLowerCase()} scraper`
    : `${objEn} scraper`;
}

/* ============================================================
   Migration
   ============================================================
   Handles:
   - v0 (very old): multi-value fields stored as strings
   - v1 (previous): { objectType: "scene", fields: [...], testCases: [...],
                      website: { ..., searchPattern, detailPattern } }
   - v2 (current): { objectTypes: [...], scrapers: { ... }, ... }
*/
const _MULTI_MAP = {
  scene:     new Set(["Performers", "Groups", "Tags", "URLs"]),
  performer: new Set(["Aliases", "URLs"]),
  group:     new Set(["Aliases", "URLs", "Tags"]),
  studio:    new Set(["Aliases", "Tags"]),
  tag:       new Set(),
};

/* Normalise multi-value test-case fields from string → array, in place-safe way. */
function _migrateTestCases(testCases, objectType) {
  const multi = _MULTI_MAP[objectType] || new Set();
  return (testCases || []).map((c) => {
    const expected = { ...(c.expected || {}) };
    for (const k of Object.keys(expected)) {
      if (multi.has(k) && typeof expected[k] === "string") {
        expected[k] = expected[k]
          .split(/[,、;\n\t]+/).map((s) => s.trim()).filter(Boolean);
      }
    }
    return { notes: "", ...c, expected };
  });
}

function _migrateTechnical(t) {
  t = t || {};
  const AUTH_DEFAULT = {
    required: false, methods: [],
    access_token: { value: "" },
    api_key_extraction: { sourceUrl: "", regex: "", targetHeader: "" },
    cookie_header: { value: "" },
    api_key_header: { name: "", value: "" },
    cookie_file: { filename: "" },
  };
  const a = t.authentication;
  let authentication;
  if (!a || typeof a !== "object") {
    authentication = { ...AUTH_DEFAULT, required: /required|need/i.test(String(a || "")) };
  } else {
    const knownMethods = ["access_token", "api_key_extraction", "cookie_header", "api_key_header", "cookie_file"];
    const legacyMethodMap = { cookie: "cookie_file", token: "access_token", session: "cookie_header" };
    const rawMethods = Array.isArray(a.methods) ? a.methods : [];
    const migratedMethods = [...new Set(rawMethods
      .map((m) => knownMethods.includes(m) ? m : legacyMethodMap[m])
      .filter(Boolean))];
    authentication = {
      ...AUTH_DEFAULT,
      ...a,
      methods: migratedMethods,
      access_token: { ...AUTH_DEFAULT.access_token, ...(a.access_token || {}) },
      api_key_extraction: { ...AUTH_DEFAULT.api_key_extraction, ...(a.api_key_extraction || {}) },
      cookie_header: { ...AUTH_DEFAULT.cookie_header, ...(a.cookie_header || {}) },
      api_key_header: { ...AUTH_DEFAULT.api_key_header, ...(a.api_key_header || {}) },
      cookie_file: { filename: a.cookie_file?.filename || a.cookieFilename || "" },
    };
  }
  return {
    rendering: (t.rendering && typeof t.rendering === "object")
      ? { dynamic: false, type: "", detail: "", ...t.rendering }
      : { dynamic: /dynamic|cdp/i.test(String(t.rendering || "")), type: "", detail: "" },
    pagination: (t.pagination && typeof t.pagination === "object")
      ? { required: false, detail: "", ...t.pagination }
      : { required: /required|need/i.test(String(t.pagination || "")), detail: "" },
    authentication,
    notes: t.notes || "",
  };
}

function migrateForm(f) {
  if (!f || typeof f !== "object") return emptyForm();

  // Already v2? Just backfill missing keys defensively.
  if (Array.isArray(f.objectTypes) && f.scrapers && typeof f.scrapers === "object") {
    const validTypes = f.objectTypes.filter((t) => OBJ_MAP[t]);
    const objectTypes = validTypes.length ? validTypes : ["scene"];
    const scrapers = {};
    for (const t of objectTypes) {
      const raw = f.scrapers[t] || {};
      scrapers[t] = {
        scraperName: raw.scraperName || "",
        searchPattern: raw.searchPattern || "",
        detailPattern: raw.detailPattern || "",
        fields: Array.isArray(raw.fields) && raw.fields.length ? raw.fields : [FIELD_MAP[t]?.[0]?.[0] || ""].filter(Boolean),
        testCases: _migrateTestCases(raw.testCases?.length ? raw.testCases : [makeCase()], t),
      };
    }
    return {
      objectTypes,
      website: {
        name: f.website?.name || "",
        baseUrl: f.website?.baseUrl || "",
        scraperName: f.website?.scraperName || "",
      },
      scrapers,
      technical: _migrateTechnical(f.technical),
    };
  }

  // v1 → v2 migration
  const legacyObjectType = OBJ_MAP[f.objectType] ? f.objectType : "scene";
  const legacyWebsite = f.website || {};
  const scraper = {
    scraperName: "",
    searchPattern: legacyWebsite.searchPattern || "",
    detailPattern: legacyWebsite.detailPattern || "",
    fields: Array.isArray(f.fields) && f.fields.length ? f.fields : [FIELD_MAP[legacyObjectType]?.[0]?.[0] || ""].filter(Boolean),
    testCases: _migrateTestCases(f.testCases?.length ? f.testCases : [makeCase()], legacyObjectType),
  };
  return {
    objectTypes: [legacyObjectType],
    website: {
      name: legacyWebsite.name || "",
      baseUrl: legacyWebsite.baseUrl || "",
      scraperName: legacyWebsite.scraperName || "",
    },
    scrapers: { [legacyObjectType]: scraper },
    technical: _migrateTechnical(f.technical),
  };
}

/* ============================================================
   useDraft — localStorage persistence
   ============================================================ */
function useDraft() {
  const [form, setForm] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        return migrateForm(parsed);
      }
    } catch {}
    return emptyForm();
  });
  const [lastSaved, setLastSaved] = useState(() => {
    try { return Number(localStorage.getItem(STORAGE_KEY + ":ts")) || null; } catch { return null; }
  });
  const isFirstRun = useRef(true);
  useEffect(() => {
    if (isFirstRun.current) { isFirstRun.current = false; return; }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(form));
      const now = Date.now();
      localStorage.setItem(STORAGE_KEY + ":ts", String(now));
      setLastSaved(now);
    } catch {}
  }, [form]);
  return [form, setForm, lastSaved];
}

/* ============================================================
   Toast
   ============================================================ */
function useToast() {
  const [msg, setMsg] = useState("");
  const timerRef = useRef(null);
  const show = useCallback((m) => {
    setMsg(m);
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setMsg(""), 2200);
  }, []);
  const Toast = () => (
    <div className={"toast" + (msg ? " show" : "")}>{msg}</div>
  );
  return [Toast, show];
}

Object.assign(window, {
  OBJECT_TYPES, OBJ_MAP, objectLabel, FIELD_MAP, STEPS,
  emptyForm, emptyScraperFor, makeCase, isUrl,
  useDraft, useToast, migrateForm, resolveScraperName,
});
</script>
<script type="text/babel">/* global React */
const { useState, useRef, useCallback } = React;

/* ============================================================
   PillInput — chip-style multi-value input
   props:
     value: string[] | string      (accepts legacy string, splits on load)
     onChange(next: string[])
     placeholder
     mono                          use mono font inside chips + input
   ============================================================ */

const SPLIT_RE = /[,、;\n\t]+/;

function normalizeToArray(v) {
  if (Array.isArray(v)) return v.filter((x) => x && String(x).trim()).map((x) => String(x).trim());
  if (typeof v === "string" && v.trim()) {
    return v.split(SPLIT_RE).map((s) => s.trim()).filter(Boolean);
  }
  return [];
}

function PillInput({ value, onChange, placeholder, mono, ariaInvalid }) {
  const values = Array.isArray(value) ? value : normalizeToArray(value);
  const [draft, setDraft] = useState("");
  const [focused, setFocused] = useState(false);
  const inputRef = useRef(null);

  const commit = useCallback((raw) => {
    const parts = String(raw).split(SPLIT_RE).map((s) => s.trim()).filter(Boolean);
    if (!parts.length) { setDraft(""); return; }
    const next = [...values];
    for (const p of parts) if (!next.includes(p)) next.push(p);
    onChange(next);
    setDraft("");
  }, [values, onChange]);

  const removeAt = (i) => {
    const next = values.slice();
    next.splice(i, 1);
    onChange(next);
    inputRef.current?.focus();
  };

  const onKeyDown = (e) => {
    if (e.key === "Enter" || e.key === "," || e.key === "、" || e.key === ";" || e.key === "Tab") {
      if (draft.trim()) {
        e.preventDefault();
        commit(draft);
      }
    } else if (e.key === "Backspace" && !draft && values.length) {
      e.preventDefault();
      // remove last chip, put its content back in draft so user can edit
      const next = values.slice(0, -1);
      setDraft(values[values.length - 1]);
      onChange(next);
    }
  };

  const onPaste = (e) => {
    const text = e.clipboardData?.getData("text");
    if (text && SPLIT_RE.test(text)) {
      e.preventDefault();
      commit((draft ? draft + "," : "") + text);
    }
  };

  const onBlur = () => {
    setFocused(false);
    if (draft.trim()) commit(draft);
  };

  return (
    <div
      className={"pill-input" + (focused ? " focus" : "") + (ariaInvalid ? " invalid" : "")}
      onClick={() => inputRef.current?.focus()}
    >
      {values.map((v, i) => (
        <span key={i} className={"pill" + (mono ? " mono" : "")}>
          <span className="pill-text">{v}</span>
          <button
            type="button"
            className="pill-x"
            onClick={(e) => { e.stopPropagation(); removeAt(i); }}
            aria-label={`Remove ${v}`}
            tabIndex={-1}
          >×</button>
        </span>
      ))}
      <input
        ref={inputRef}
        className={"pill-draft" + (mono ? " mono" : "")}
        value={draft}
        onChange={(e) => setDraft(e.target.value)}
        onKeyDown={onKeyDown}
        onPaste={onPaste}
        onFocus={() => setFocused(true)}
        onBlur={onBlur}
        placeholder={values.length === 0 ? (placeholder || "輸入後按 Enter") : ""}
      />
    </div>
  );
}

Object.assign(window, { PillInput, normalizePillValue: normalizeToArray, SPLIT_RE });
</script>
<script type="text/babel">/* global React */
const { useMemo, useState } = React;
const PillInput = window.PillInput;

/* fields that accept multiple values → rendered with PillInput */
const MULTI_FIELDS = {
  scene:     new Set(["Performers", "Groups", "Tags", "URLs"]),
  performer: new Set(["Aliases", "URLs"]),
  group:     new Set(["Aliases", "URLs", "Tags"]),
  studio:    new Set(["Aliases", "Tags"]),
  tag:       new Set(),
};
const isMultiField = (objectType, fieldEn) =>
  MULTI_FIELDS[objectType]?.has(fieldEn) || false;

/* count of "filled" values for a given field entry (string or array) */
const valueFilled = (v) => {
  if (Array.isArray(v)) return v.length > 0;
  return !!(v && String(v).trim());
};

/* Two-stage confirmation button for destructive case-level actions */
function RemoveCaseButton({ onRemove }) {
  const [confirming, setConfirming] = React.useState(false);
  const timerRef = React.useRef(null);
  React.useEffect(() => () => clearTimeout(timerRef.current), []);
  const cancel = (e) => {
    e?.stopPropagation();
    clearTimeout(timerRef.current);
    setConfirming(false);
  };
  const arm = (e) => {
    e.stopPropagation();
    setConfirming(true);
    timerRef.current = setTimeout(() => setConfirming(false), 4000);
  };
  const fire = (e) => {
    e.stopPropagation();
    clearTimeout(timerRef.current);
    setConfirming(false);
    onRemove();
  };
  if (!confirming) {
    return (
      <button type="button" className="icon-btn icon-btn-sm danger-hover"
        onClick={arm}
        aria-label="移除案例 / Remove case"
        title="移除案例 / Remove case">
        <svg className="svg-glyph" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 4 L12 12 M12 4 L4 12" />
        </svg>
      </button>
    );
  }
  return (
    <div className="reset-confirm sm" onClick={(e) => e.stopPropagation()}>
      <span className="reset-msg">移除？ <span className="en">Remove?</span></span>
      <button type="button" className="btn-mini danger" onClick={fire}>移除 / YES</button>
      <button type="button" className="btn-mini" onClick={cancel}>取消 / NO</button>
    </div>
  );
}

/* ============================================================
   Label component — 中文為主，英文小字副標
   ============================================================ */
function Label({ zh, en, required, showEn }) {
  return (
    <div className="label">
      <span>{zh}{required && <span className="req" style={{ marginLeft: 4 }}>*</span>}</span>
      {showEn && en && <span className="en">{en}</span>}
    </div>
  );
}

/* ============================================================
   Section 1 — Target
   ============================================================
   Multi-select object types (Scene / Performer / Group / Studio / Tag).
   Website info (name, baseUrl, scraperName) is SHARED across all scrapers.
   Per-scraper detail: searchPattern + detailPattern moved to section 02.
*/
function TargetSection({ form, setForm, errors, showEn }) {
  const upd = (k, v) => setForm((f) => ({ ...f, website: { ...f.website, [k]: v } }));
  const toggleType = (id) => setForm((f) => {
    const has = f.objectTypes.includes(id);
    if (has) {
      // Refuse to remove the last one
      if (f.objectTypes.length <= 1) return f;
      const nextTypes = f.objectTypes.filter((t) => t !== id);
      const nextScrapers = { ...f.scrapers };
      delete nextScrapers[id];
      return { ...f, objectTypes: nextTypes, scrapers: nextScrapers };
    }
    // Add: create a fresh scraper block for this type
    return {
      ...f,
      objectTypes: [...f.objectTypes, id],
      scrapers: { ...f.scrapers, [id]: emptyScraperFor(id) },
    };
  });

  return (
    <section id="target" className="section" data-section="target" data-screen-label="01 Target">
      <div className="sec-head">
        <span className="idx">01</span>
        <h2>目標 {showEn && <span className="en">Target</span>}</h2>
      </div>
      <p className="sec-desc">選擇要抓取的物件類型（可多選），並定義共用的網站資訊。搜尋/詳情規則於下方各物件區塊分別設定。</p>

      <div className="field">
        <Label zh="物件類型（可多選）" en="Object Types (multi-select)" required showEn={showEn} />
        <div className="checks">
          {OBJECT_TYPES.map((o) => {
            const on = form.objectTypes.includes(o.id);
            const isLast = on && form.objectTypes.length === 1;
            return (
              <label key={o.id}
                className={"checkline" + (on ? " on" : "") + (isLast ? " disabled" : "")}
                title={isLast ? "至少需保留一個物件類型" : ""}>
                <input type="checkbox" checked={on}
                  disabled={isLast}
                  onChange={() => toggleType(o.id)} />
                <span className="zh">{o.zh}</span>
                {showEn && <span className="en">{o.en}</span>}
              </label>
            );
          })}
        </div>
      </div>

      <div className="row">
        <div className="field">
          <Label zh="網站名稱" en="Website" required showEn={showEn} />
          <input className="input" value={form.website.name}
            placeholder="e.g. ExampleSite"
            onChange={(e) => upd("name", e.target.value)} />
        </div>
        <div className="field">
          <Label zh="爬蟲名稱基底" en="Scraper Name (base)" showEn={showEn} />
          <input className="input mono" value={form.website.scraperName}
            placeholder="ExampleSite"
            onChange={(e) => upd("scraperName", e.target.value)} />
        </div>
      </div>

      <div className="field">
        <Label zh="網站網址" en="Base URL" required showEn={showEn} />
        <input className="input mono" type="url" value={form.website.baseUrl}
          placeholder="https://example.com"
          aria-invalid={errors.baseUrl ? "true" : "false"}
          onChange={(e) => upd("baseUrl", e.target.value)} />
        {errors.baseUrl && <span className="err">{errors.baseUrl}</span>}
      </div>
    </section>
  );
}

/* ============================================================
   Section 2 — Fields (one per objectType)
   ============================================================
   Renders one <section> per selected objectType. Each block starts with
   the per-scraper name + search/detail patterns (with "copy from previous"
   buttons), then the field-checkbox grid.
   Wrapper <FieldsSections /> loops form.objectTypes and emits one <FieldsBlock/>
   per type.
*/
function FieldsSections({ form, setForm, showEn, onToast }) {
  return (
    <>
      {form.objectTypes.map((typeId, idx) => (
        <FieldsBlock key={typeId} typeId={typeId} idx={idx}
          form={form} setForm={setForm} showEn={showEn} onToast={onToast} />
      ))}
    </>
  );
}

function FieldsBlock({ typeId, idx, form, setForm, showEn, onToast }) {
  const avail = FIELD_MAP[typeId] || [];
  const scraper = form.scrapers[typeId] || {};
  const objInfo = OBJ_MAP[typeId] || { zh: typeId, en: typeId };

  const setScraper = (patch) => setForm((f) => ({
    ...f,
    scrapers: { ...f.scrapers, [typeId]: { ...(f.scrapers[typeId] || {}), ...patch } },
  }));

  const toggleField = (name) => setForm((f) => {
    const cur = f.scrapers[typeId] || {};
    const has = (cur.fields || []).includes(name);
    return {
      ...f,
      scrapers: {
        ...f.scrapers,
        [typeId]: {
          ...cur,
          fields: has
            ? cur.fields.filter((x) => x !== name)
            : [...(cur.fields || []), name],
        },
      },
    };
  });

  const allFields = () => setScraper({ fields: avail.map((x) => x[0]) });
  const noneFields = () => setScraper({ fields: [] });

  const prevTypeId = idx > 0 ? form.objectTypes[idx - 1] : null;
  const canCopyPattern = !!prevTypeId;
  const copyPatternsFromPrev = () => {
    if (!prevTypeId) return;
    const prev = form.scrapers[prevTypeId] || {};
    setScraper({
      searchPattern: prev.searchPattern || "",
      detailPattern: prev.detailPattern || "",
    });
    onToast?.(`已複製 ${OBJ_MAP[prevTypeId]?.zh || prevTypeId} 的規則 / Copied patterns`);
  };

  // Unique DOM id so scroll-spy can find each block
  const sectionId = `fields-${typeId}`;
  const label = showEn
    ? <>提取欄位 · <span className="scr-tag">{objInfo.zh}</span> <span className="en">Fields · {objInfo.en}</span></>
    : <>提取欄位 · <span className="scr-tag">{objInfo.zh}</span></>;

  // Per-scraper color slot: 1..5 based on order in objectTypes (1st = deepest,
  // wraps at 5). Only applied when >1 scraper exists — single-scraper mode
  // falls back to the original brand palette so nothing changes visually.
  const colorSlot = form.objectTypes.length > 1
    ? String((idx % 5) + 1)
    : null;

  return (
    <section id={sectionId} className="section" data-section="fields" data-object-type={typeId}
      data-scraper-color={colorSlot || undefined}
      data-screen-label={`02 Fields (${objInfo.en})`}>
      <div className="sec-head">
        <span className="idx">02</span>
        <h2>{label}</h2>
      </div>

      {/* Per-scraper name + patterns (moved here from section 01) */}
      <div className="row">
        <div className="field">
          <Label zh="Scraper 名稱" en="Scraper Name" showEn={showEn} />
          <input className="input mono" value={scraper.scraperName || ""}
            placeholder={resolveScraperName(form, typeId)}
            onChange={(e) => setScraper({ scraperName: e.target.value })} />
          <span className="hint">未填則使用預設：<code>{resolveScraperName(form, typeId)}</code></span>
        </div>
        <div className="field" />
      </div>

      <div className="row">
        <div className="field">
          <Label zh="搜尋模式" en="Search Pattern" showEn={showEn} />
          <input className="input mono" value={scraper.searchPattern || ""}
            placeholder="/search?q={query}"
            onChange={(e) => setScraper({ searchPattern: e.target.value })} />
        </div>
        <div className="field">
          <Label zh="詳情頁模式" en="Detail Pattern" showEn={showEn} />
          <input className="input mono" value={scraper.detailPattern || ""}
            placeholder={typeId === "performer" ? "/actor/{id}" : "/scene/{id}"}
            onChange={(e) => setScraper({ detailPattern: e.target.value })} />
        </div>
      </div>

      {canCopyPattern && (
        <div className="copy-prev-row">
          <button type="button" className="btn btn-ghost btn-sm" onClick={copyPatternsFromPrev}>
            ⎘ 複製 {OBJ_MAP[prevTypeId]?.zh || prevTypeId} 的搜尋/詳情規則
            {showEn && <span className="en">Copy patterns from {OBJ_MAP[prevTypeId]?.en}</span>}
          </button>
        </div>
      )}

      {/* Field-checkbox grid */}
      <div className="sec-desc" style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginTop: 20 }}>
        <span>勾選需要提取的欄位。已選 <b style={{ color: "var(--c-brand-700)", fontFamily: "var(--f-mono)" }}>{(scraper.fields || []).length} / {avail.length}</b></span>
        <button type="button" className="btn btn-ghost" style={{ padding: "4px 12px", fontSize: 13 }} onClick={allFields}>全選</button>
        <button type="button" className="btn btn-ghost" style={{ padding: "4px 12px", fontSize: 13 }} onClick={noneFields}>清除</button>
      </div>

      <div className="checks">
        {avail.map(([en, zh]) => {
          const on = (scraper.fields || []).includes(en);
          return (
            <label key={en} className={"checkline" + (on ? " on" : "")}>
              <input type="checkbox" checked={on} onChange={() => toggleField(en)} />
              <span className="zh">{zh}</span>
              {showEn && <span className="en">{en}</span>}
            </label>
          );
        })}
      </div>
    </section>
  );
}

/* ============================================================
   Section 3 — Test Cases (one per objectType)
   ============================================================
   Wrapper loops form.objectTypes, emits one <TestCasesBlock/> per type.
   Each block has its own test cases with per-scraper expected fields.
*/
function TestCasesSections({ form, setForm, showEn }) {
  return (
    <>
      {form.objectTypes.map((typeId, idx) => (
        <TestCasesBlock key={typeId} typeId={typeId} idx={idx}
          form={form} setForm={setForm} showEn={showEn} />
      ))}
    </>
  );
}

function TestCasesBlock({ typeId, idx, form, setForm, showEn }) {
  const avail = FIELD_MAP[typeId] || [];
  const scraper = form.scrapers[typeId] || { fields: [], testCases: [] };
  const objInfo = OBJ_MAP[typeId] || { zh: typeId, en: typeId };
  const activeFields = avail.filter(([en]) => (scraper.fields || []).includes(en));

  const updateScraper = (mut) => setForm((f) => {
    const cur = f.scrapers[typeId] || {};
    return { ...f, scrapers: { ...f.scrapers, [typeId]: mut(cur) } };
  });

  const updCase = (id, patch) => updateScraper((cur) => ({
    ...cur,
    testCases: (cur.testCases || []).map((c) => c.id === id ? { ...c, ...patch } : c),
  }));
  const updExpected = (id, key, val) => updateScraper((cur) => ({
    ...cur,
    testCases: (cur.testCases || []).map((c) => c.id === id
      ? { ...c, expected: { ...c.expected, [key]: val } } : c),
  }));
  const removeCase = (id) => updateScraper((cur) => ({
    ...cur,
    testCases: (cur.testCases || []).filter((c) => c.id !== id),
  }));
  const addCase = () => updateScraper((cur) => ({
    ...cur,
    testCases: [...(cur.testCases || []), makeCase()],
  }));

  const sectionId = `cases-${typeId}`;
  const label = showEn
    ? <>測試案例 · <span className="scr-tag">{objInfo.zh}</span> <span className="en">Test Cases · {objInfo.en}</span></>
    : <>測試案例 · <span className="scr-tag">{objInfo.zh}</span></>;

  // Per-scraper color slot — mirrors FieldsBlock so paired sections share color
  const colorSlot = form.objectTypes.length > 1
    ? String((idx % 5) + 1)
    : null;

  return (
    <section id={sectionId} className="section" data-section="cases" data-object-type={typeId}
      data-scraper-color={colorSlot || undefined}
      data-screen-label={`03 Test Cases (${objInfo.en})`}>
      <div className="sec-head">
        <span className="idx">03</span>
        <h2>{label}</h2>
      </div>
      <p className="sec-desc">為每個測試 URL 定義預期提取值，用於驗證爬蟲結果。</p>

      {(scraper.testCases || []).map((c, i) => {
        const urlOk = isUrl(c.url);
        const filled = Object.values(c.expected).filter(valueFilled).length;
        const hasNote = !!(c.notes && c.notes.trim());
        return (
          <div key={c.id} className="case" data-open={c.open}>
            <div className="case-hd" onClick={() => updCase(c.id, { open: !c.open })}>
              <span className="caret" />
              <span className="title">案例 {String(i + 1).padStart(2, "0")}</span>
              <span className="url-preview">{c.url || "尚未填入 URL"}</span>
              {hasNote && (
                <span className="note-flag" title="此案例有附註 / Has note">
                  <span className="glyph">✎</span>
                </span>
              )}
              <span className={"badge " + (urlOk ? "ok" : (c.url ? "warn" : ""))}>
                {urlOk ? `${filled} / ${activeFields.length}` : (c.url ? "URL 無效" : "空")}
              </span>
              <RemoveCaseButton onRemove={() => removeCase(c.id)} />
            </div>
            {c.open && (
