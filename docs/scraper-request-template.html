<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scraper Request / 爬蟲請求</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:24px;background:#f7f7f8;color:#202124}main{background:#fff;padding:24px;border-radius:12px}label{display:block;font-weight:600;margin-top:12px}input,textarea,select{width:100%;box-sizing:border-box;padding:9px;margin-top:4px}fieldset{margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:8px}.case{background:#fafafa;border-left:4px solid #2463eb;padding:16px;margin:12px 0}.actions button{margin:6px;padding:9px 14px}pre{white-space:pre-wrap;background:#1f2937;color:#fff;padding:14px;border-radius:8px}a{display:inline-block;margin-top:8px}</style></head><body><main><h1>Scraper Request / 爬蟲請求</h1><p>Describe target pages and expected extraction results for the scraper skill. / 說明目標頁面與預期提取結果。</p><fieldset><legend>Target / 目標</legend><label>Object type / 物件類型<select id="type" onchange="renderFields()"><option value="scene">Scene / 場景</option><option value="performer">Performer / 演出者</option><option value="group">Group / 合集</option><option value="studio">Studio / 製作商</option><option value="tag">Tag / 標籤</option></select></label><label>Website / 網站<input id="site"></label><label>Base URL / 網站網址<input id="base" type="url"></label><label>Scraper name / 爬蟲名稱<input id="scraper"></label><label>Search pattern / 搜尋模式<input id="search"></label><label>Detail pattern / 詳情頁模式<input id="detail"></label></fieldset><fieldset><legend>Fields to extract / 提取欄位</legend><div id="fields"></div></fieldset><fieldset><legend>Test cases / 測試案例</legend><div id="cases"></div><button type="button" onclick="addCase()">Add test case / 新增測試案例</button></fieldset><fieldset><legend>Technical notes / 技術備註</legend><label>Rendering / 渲染<select id="render"><option>Static HTML / 靜態 HTML</option><option>Dynamic / 動態（CDP）</option></select></label><label>Pagination / 分頁<select id="pages"><option>None / 無</option><option>Required / 需要</option></select></label><label>Authentication / 登入<select id="auth"><option>Public / 公開</option><option>Required / 需要登入</option></select></label><label>Notes / 備註<textarea id="notes"></textarea></label></fieldset><div class="actions"><button onclick="show('md')">Export Markdown / 匯出 Markdown</button><button onclick="show('json')">Export JSON / 匯出 JSON</button></div><pre id="out" hidden></pre></main><script>const map={scene:['Title / 標題','Code / 編號','Date / 日期','Details / 詳情','Image / 圖片','Performers / 演出者','Groups / 合集','Studio / 製作商','Tags / 標籤','URLs / 網址'],performer:['Name / 姓名','Aliases / 別名','Gender / 性別','Country / 國家','Ethnicity / 種族','Height / 身高','Weight / 體重','PenisLength / 陰莖長度','URLs / 網址'],group:['Name / 名稱','Aliases / 別名','Date / 日期','Studio / 製作商','Duration / 時長','Synopsis / 簡介','FrontImage / 封面','BackImage / 封底','URLs / 網址','Tags / 標籤'],studio:['Name / 名稱','Aliases / 別名','Details / 詳情','Tags / 標籤','URL / 網址'],tag:['Name / 名稱']};function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderFields(){const f=map[type.value];fields.innerHTML=f.map((x,i)=>`<label><input type="checkbox" value="${x}" ${i===0?'checked':''}> ${x}</label>`).join('');cases.innerHTML='';addCase()}function addCase(){const id='c'+Date.now()+Math.random();const f=map[type.value];const d=document.createElement('div');d.className='case';d.id=id;d.innerHTML=`<strong>Test case / 測試案例</strong><label>URL / 網址<input class="url" type="url" oninput="link('${id}')"></label><a class="go" target="_blank" hidden>Preview URL / 預覽網址</a>${f.map(x=>`<label>${x}<input data-field="${x}" placeholder="Expected value / 預期值"></label>`).join('')}<button type="button" onclick="document.getElementById('${id}').remove()">Remove / 移除</button>`;cases.appendChild(d)}function link(id){const d=document.getElementById(id),u=d.querySelector('.url').value,a=d.querySelector('.go');if(/^https?:\/\//.test(u)){a.href=u;a.hidden=false}else a.hidden=true}function data(){const f=map[type.value];return{objectType:type.value,website:{name:site.value,baseUrl:base.value,scraperName:scraper.value,searchPattern:search.value,detailPattern:detail.value},fields:[...fields.querySelectorAll('input:checked')].map(x=>x.value),testCases:[...cases.children].map(c=>({url:c.querySelector('.url').value,expected:Object.fromEntries(f.map(x=>[x,c.querySelector(`[data-field="${x}"]`).value]))})),technical:{rendering:render.value,pagination:pages.value,authentication:auth.value,notes:notes.value}}}function show(kind){const d=data();out.hidden=false;if(kind==='json')out.textContent=JSON.stringify(d,null,2);else out.textContent=`# Scraper Request\n\n## Target\n- Object type: ${d.objectType}\n- Website: ${d.website.name}\n- Base URL: ${d.website.baseUrl}\n- Scraper: ${d.website.scraperName}\n\n## Fields\n${d.fields.map(x=>'- '+x).join('\n')}\n\n## Test Cases\n${d.testCases.map((c,i)=>`### ${i+1}\n- URL: ${c.url}\n${Object.entries(c.expected).filter(([,v])=>v).map(([k,v])=>'- '+k+': '+v).join('\n')}`).join('\n\n')}\n\n## Technical Notes\n- Rendering: ${d.technical.rendering}\n- Pagination: ${d.technical.pagination}\n- Authentication: ${d.technical.authentication}\n- Notes: ${d.technical.notes}`)}renderFields()</script></body></html>
