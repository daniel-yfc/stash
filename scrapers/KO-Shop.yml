# KO Shop — public CDP version
# Public CDP version: driver.useCDP: true; no driver.cookies.
# Last Updated: 2026-08-28

name: KO Shop

sceneByURL:
  - action: scrapeXPath
    url:
      - ko-shop.com/products/detail.php
      - www.ko-shop.com/products/detail.php
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: "https://www.ko-shop.com/products/list.php?word={}"
  scraper: searchScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  searchScraper:
    common:
      $results: "//a[contains(@href,'/products/detail.php?product_id=')][.//img]"
  sceneScraper:
    common:
      $meta: "//div[contains(@class,'detail_product')]//dl[1]"

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0
