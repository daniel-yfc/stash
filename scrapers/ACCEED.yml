# Last Updated: 2026-08-28
# ACCEED (acceed.jp) — public CDP version.
# Verification status: UNVERIFIED against live Stash.
# Test URLs from ACCEED-2.md:
#   - https://acceed.jp/detail.ACST424.html
#   - https://acceed.jp/detail.ACST426.html
#   - https://acceed.jp/detail.OCON059.html
# Search URL: https://acceed.jp/search.php?s={keyword}
# Expected fields: Title, Date, Image, Code, URL, Tags, Details, Studio, Performer
# Add sceneByFragment for runtime safety.

name: ACCEED

sceneByURL:
  - action: scrapeXPath
    url:
      - "acceed.jp/detail."
      - "www.acceed.jp/detail."
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "https://acceed.jp/search.php?s={}"
  scraper: searchScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  scraper: sceneScraper

xPathScrapers:
  searchScraper:
    common:
      $results: "//div[contains(@class,'list_area')][.//a[contains(@href,'/detail.')]]"

    scene:
      Title:
        selector: "$results//a[contains(@href,'/detail.')]//img/@alt | $results//h3"
        postProcess:
          - replace:
              - regex: "\\s{2,}"
                with: " "
              - regex: "^\\s+|\\s+$"
                with: ""

      URLs:
        selector: "$results//a[contains(@href,'/detail.')][1]/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              v = v.replace(/^http:\/\//i, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://acceed.jp" + v;
              return "https://acceed.jp/" + v;

      Image:
        selector: "$results//img[contains(@src,'/pic_base/')]/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              v = v.replace(/^http:\/\//i, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://acceed.jp" + v;
              return "https://acceed.jp/" + v;

  sceneScraper:
    common:
      $detail: "//div[contains(@class,'detail_box')]"
      $info: "//div[@id='main']"

    scene:
      Title:
        selector: "//h1[@id='title'] | //h1[contains(@class,'product_title')]"
        postProcess:
          - replace:
              - regex: "\\s{2,}"
                with: " "
              - regex: "^\\s+|\\s+$"
                with: ""

      Code:
        selector: "//div[contains(@class,'product_code')] | //p[contains(.,'商品コード')]"
        postProcess:
          - javascript: |
              var v = value || "";
              var m = v.match(/([A-Z]{2,}\d{3,})/i);
              return m ? m[1].toUpperCase() : "";

      URLs:
        selector: "//link[@rel='canonical']/@href | //meta[@property='og:url']/@content"
        concat: "\n"
        postProcess:
          - javascript: |
              var seen = {};
              var out = [];
              function add(u) {
                u = (u || "").replace(/^\s+|\s+$/g, "");
                if (!u) return;
                u = u.replace(/^\/\//, "https://");
                u = u.replace(/^http:\/\//i, "https://");
                if (u.indexOf("http") !== 0) {
                  if (u.charAt(0) !== "/") return;
                  u = "https://acceed.jp" + u;
                }
                if (seen[u]) return;
                seen[u] = true;
                out.push(u);
              }
              (value || "").split(/\n/).forEach(add);
              return out.join("\n");
        split: "\n"

      Date:
        selector: "//div[contains(@class,'release_date')] | //p[contains(.,'発売日')]"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              var m = v.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
              if (!m) m = v.match(/(\d{4})[.\/\-](\d{1,2})[.\/\-](\d{1,2})/);
              if (!m) return "";
              var mm = ("0" + m[2]).slice(-2);
              var dd = ("0" + m[3]).slice(-2);
              return m[1] + "-" + mm + "-" + dd;
          - parseDate: "2006-01-02"

      Details:
        selector: "$detail//div[contains(@class,'description')]//text()[normalize-space()] | $detail//p[contains(@class,'comment')]//text()[normalize-space()]"
        concat: "\n"
        postProcess:
          - javascript: |
              var v = value || "";
              v = v.replace(/\r\n/g, "\n");
              v = v.replace(/[ \t]+\n/g, "\n");
              v = v.replace(/^\s*商品説明\s*/g, "");
              v = v.replace(/\n{3,}/g, "\n\n");
              return v.replace(/^\s+|\s+$/g, "");

      Image:
        selector: "//div[@id='detail_image']//img[contains(@src,'/pic_base/')]/@src | //meta[@property='og:image']/@content"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              v = v.replace(/^http:\/\//i, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://acceed.jp" + v;
              return "https://acceed.jp/" + v;

      Studio:
        Name:
          selector: "//div[contains(@class,'maker')]//a | //p[contains(.,'メーカー')]//a"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""

      Tags:
        Name:
          selector: "$detail//div[contains(@class,'category')]//a | $detail//p[contains(@class,'tag')]//a"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""

      Performers:
        Name:
          selector: "$detail//div[contains(@class,'actor')]//a | $detail//p[contains(.,'出演者')]//a | //a[contains(@href,'/search.php?model=')]"
          postProcess:
            - replace:
                - regex: "^\\s+|\\s+$"
                  with: ""

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
