name: Justice01
id: justice01
sceneByURL:
  - action: scrapeXPath
    url:
      - justice01.com/
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://www.justice01.com/search.php?s={}&image=商品検索&fromSearch=on
  scraper: sceneSearch
xPathScrapers:
  sceneSearch:
    common:
      $item: //div[contains(@class, "item") or contains(@class, "product")]
    scene:
      Title: $item//h3//text()
      URL: $item//a/@href
      Image: $item//img/@src
  sceneScraper:
    scene:
      Title: //h2//text()
      Details:
        selector: //div[contains(@class, "content")]//text()
        concat: "\n"
      Image:
        - //img[contains(@src, "/wp-content/")]/@src
        - //meta[@property="og:image"]/@content
      Studio:
        Name: "Justice"
      Tags:
        Name:
          - //a[@rel="category tag"]//text()
          - //a[contains(@href, "/tag/")]//text()
      URLs:
        - fixed: "{inputURL}"
