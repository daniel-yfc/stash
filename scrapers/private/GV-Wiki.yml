# GV-Wiki
# Private scraper: requires session cookies captured from an authenticated browser.
# Do NOT commit real cookie values. Placeholder tokens use <GVWIKI_*>; replace them
# locally or in a deployment/secrets pipeline before copying this file into Stash.
# Stash does not expand shell/environment variables inside scraper YAML.
# Cookies captured/noted 2026-09-15 (names only; values intentionally omitted):
#   - csrftoken
#   - gcaycnniik3
#   - gdaydid
#   - gnn_sbbcda (HttpOnly in supplied capture; likely auth/session; treat as secret)
# Browser capture note: duplicate names were observed on .www.gvwiki.com and
# .gvwiki.com. Entries below are normalized to .gvwiki.com for shared coverage.
# Review note: this metadata update did not review a rendered or unrendered
# GV-Wiki page. Selectors and live behavior remain UNVERIFIED against live Stash.
# Last Updated: 2026-09-15
# Validator fixes:
#   - removed CookieURL (not allowed when useCDP is true)
#   - sceneByURL regex -> simple prefix (url items are plain strings)
#   - {query} -> {} (Stash sceneByName only substitutes the {} placeholder)
#   - replaced invalid `trim` postProcess with replace-regex trim
#   - inlined $main into $info (recursive common fragments are not supported)

name: GV-Wiki

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
  cookies:
    # Stash driver cookie fields are Name, Value, Domain, and Path.
    # CookieURL is intentionally omitted because useCDP is true.
    # Deployment must render these <GVWIKI_*> placeholders from local secrets.
    # Environment variables alone are not expanded by Stash at runtime.
    - Cookies:
        - Name: "csrftoken"
          Value: "<GVWIKI_CSRFTOKEN>"
          Domain: ".gvwiki.com"
          Path: "/"
        - Name: "gcaycnniik3"
          Value: "<GVWIKI_GCAYCNNIIK3>"
          Domain: ".gvwiki.com"
          Path: "/"
        - Name: "gdaydid"
          Value: "<GVWIKI_GDAYDID>"
          Domain: ".gvwiki.com"
          Path: "/"
        - Name: "gnn_sbbcda"
          Value: "<GVWIKI_GNN_SBBCDA>"
          Domain: ".gvwiki.com"
          Path: "/"

sceneByURL:
  - action: scrapeXPath
    url:
      - gvwiki.com/video/
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: "https://www.gvwiki.com/search?q={}&r=vm"
  scraper: searchScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: "https://www.gvwiki.com/search?q={title}&r=vm"
  scraper: searchScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  searchScraper:
    common:
      $results: "//a[contains(@href, '/video/')][not(contains(@href, '/video/search'))]"
    scene:
      Title:
        selector: "$results/text()"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      URLs:
        selector: "$results/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              return /^https?:\/\//.test(v) ? v : "https://gvwiki.com" + v;

  sceneScraper:
    common:
      $main: "//main"
      $info: "//main//table[contains(concat(' ', normalize-space(@class), ' '), ' is-fullwidth ')]"
    scene:
      Title:
        selector: "$main//h1[contains(concat(' ', normalize-space(@class), ' '), ' title ')]/text()"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      Code:
        selector: "$info//tr[td[1][normalize-space()='ID']]/td[2]/text()"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
      Date:
        selector: "$info//tr[td[1][normalize-space()='Release Date']]/td[2]/text()"
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""
          - parseDate: "2006-01-02"
      Details:
        selector: "$main//*[@id='plot-box']//p"
      Image:
        selector: "$main//div[contains(concat(' ', normalize-space(@class), ' '), ' swiper-slide ')][1]//img/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              return /^https?:\/\//.test(v) ? v : "https://gvwiki.com" + v;
      Studio:
        Name:
          selector: "$info//tr[td[1][normalize-space()='Company']]/td[2]/text()"
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""
      Tags:
        Name:
          selector: "$info//tr[td[1][normalize-space()='Tag']]/td[2]//a/text()"
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""
      Performers:
        Name:
          selector: "$main//a[starts-with(@href, '/model/')]/text()"
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""
      URLs:
        selector: "$info//tr[td[1][normalize-space()='Buy']]/td[2]//a/@href | //link[@rel='canonical']/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              return /^https?:\/\//.test(v) ? v : "https://gvwiki.com" + v;
