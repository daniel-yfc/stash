# KO Shop — private cookie version
# Do not set useCDP. Cookie-based login only.
# Last Updated: 2026-08-28

name: KO Shop
sceneByURL:
  - action: scrapeXPath
    url:
      - ko-shop.com/products/detail.php
      - www.ko-shop.com/products/detail.php
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: "https://www.ko-shop.com/products/list.php?word={}"
  scraper: searchScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
xPathScrapers:
  searchScraper:
    common:
      $results: "//a[contains(@href,'/products/detail.php?product_id=')][.//img]"
driver:
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0
  cookies:
    - CookieURL: "https://ko-shop.com"
      Cookies:
        - Name: modal
          Value: off
          Domain: .ko-shop.com
          Path: "/"
        - Name: KOSCOMID
          Value: 8erpg4bqnc4juj3ghln6j4oh82
          Domain: .ko-shop.com
          Path: "/"
        - Name: login_email
          Value: eddie.lu%40tensi.org
          Domain: .ko-shop.com
          Path: "/"
