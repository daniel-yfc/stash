# KO Video — private build: cookies + CookieURL. Do not set driver.useCDP.
# Search verification: selectors checked against rendered search DOM
#   https://ko-video.com/products/list.php?name=雄穴
#   (2026-08-27 snapshot). sceneByURL still UNVERIFIED against live detail pages.
# Last Updated: 2026-08-28

name: KO Video

sceneByURL:
  - action: scrapeXPath
    url:
      - ko-video.com/products/detail.php
      - www.ko-video.com/products/detail.php
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: https://ko-video.com/products/list.php?name={}
  scraper: searchScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: https://ko-video.com/products/list.php?name={title}
  queryURLReplace:
    title:
      - regex: '\.[^.]+$'
        with: ''
      - regex: '[_\.]+'
        with: ' '
      - regex: '\s{2,}'
        with: ' '
      - regex: '^\s+|\s+$'
        with: ''
  scraper: searchScraper

xPathScrapers:
  searchScraper:
    common:
      # contains('item_list') also matches ul.item_list_last
      $results: //section[contains(@class,'shoppingcontents_col')]//ul[contains(@class,'item_list')]//li[.//a[contains(@href,'/products/detail.php')]]

    scene:
      Title:
        selector: $results//img[1]/@alt | $results//span[1]
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ''

      Code:
        selector: $results//a[contains(@href,'/products/detail.php')][1]/@href
        postProcess:
          - replace:
              - regex: '^.*?[?&]product_code=([^&]+).*$'
                with: '$1'
              - regex: '\s+'
                with: ''

      URLs:
        selector: $results//a[contains(@href,'/products/detail.php')][1]/@href
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://ko-video.com" + v;
              return "https://ko-video.com/" + v;

      Image:
        selector: $results//img[1]/@src
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://ko-video.com" + v;
              return "https://ko-video.com/" + v;

  sceneScraper:
    common:
      $meta: //div[contains(@class,'detail_product')][1]//dl[1]
      $performers: //div[contains(@class,'model_performance')][1]//div[contains(@class,'owl-carousel')]//div[@class='item']//a/span

    scene:
      Title:
        selector: //div[contains(@class,'detail_main_col')]//div[@class='title_bar'][1]/h2[1]
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ''

      Code:
        selector: //input[@name='product_code']/@value
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ''

      Date:
        selector: $meta/dt[normalize-space(.)='商品発売日']/following-sibling::dd[1]
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              var m = v.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/u);
              if (m) {
                var mm = ("0" + m[2]).slice(-2);
                var dd = ("0" + m[3]).slice(-2);
                return m[1] + "-" + mm + "-" + dd;
              }
              return v.trim();
          - parseDate: "2006-01-02"

      Studio:
        Name:
          selector: $meta/dt[normalize-space(.)='メーカー/レーベル']/following-sibling::dd[1]/a[last()]
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ''

      Performers:
        Name:
          selector: $performers
          postProcess:
            - javascript: |
                var v = value || "";
                if (!v) return "";
                var n = v.replace(/\s+/g, ' ').trim();
                if (!n) return "";
                n = n.replace(/\s*[（(][぀-ゟ゠-ハー]+[)）]\s*/gu, '');
                var kanaLead = n.match(/^[぀-ゟ゠-ハー]+\s+(.+)$/u);
                if (kanaLead) n = kanaLead[1].trim();
                var mixed = n.match(/^([^\x00-\x7F]+)\s+[A-Za-z\s]+$/u);
                if (mixed) n = mixed[1].trim();
                return n;

      Tags:
        Name:
          selector: $meta/dt[normalize-space(.)='シリーズ/ジャンル']/following-sibling::dd[1]//a
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ''

      Details:
        selector: //p[@class='deitail_txt' or @class='detail_txt']
        concat: "\n"

      Image:
        selector: //div[contains(@class,'detail_main_col')]//a[contains(@class,'fancybox') and not(contains(@href,'/gallery/'))][1]/@href
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (v.indexOf("http") === 0) return v;
              if (v.indexOf("/") === 0) return "https://ko-video.com" + v;
              return "https://ko-video.com/" + v;

