# COAT — private cookie version
# Do not set useCDP. Cookie-based login only.
# Last Updated: 2026-08-28

name: COAT
sceneByURL:
  - action: scrapeXPath
    url:
      - coat.co.jp/products/detail.php
      - www.coat.co.jp/products/detail.php
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: "https://www.coat.co.jp/products/list.php?mode=search&name={}"
  scraper: searchScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
xPathScrapers:
  searchScraper:
    common:
      $results: "//div[@id='product-list-wrap']//div[contains(@class,'list_area')][.//a[contains(@href,'/products/detail.php')]]"
  sceneScraper:
    common:
      $jacket: "//div[@id='jacket']"
driver:
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0
  cookies:
    - CookieURL: "https://www.coat.co.jp"
      Cookies:
        - Name: over18
          Value: "Yes"
          Domain: www.coat.co.jp
          Path: "/"
        - Name: ECSESSID
          Value: ds1cf3e1csgtqs21ksj0hg8kl0
          Domain: www.coat.co.jp
          Path: "/"
        - Name: login_email
          Value: eddie.lu%40tensi.org
          Domain: www.coat.co.jp
          Path: "/"
