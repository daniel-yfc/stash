# Hunk's Channel — groupByURL + sceneByURL scraper
# Verification: UNVERIFIED — test every mode against 3+ real pages before use.
#
# Age-gate / login note:
# This site uses login/age-gate and cookies.
# Test with useCDP: true in Stash settings or per-scraper config.
# See: skills/stash-scraper-builder/references/scraping-failures.md

name: "Hunk's Channel"

# Group scraper (series / collection pages)
groupByURL:
  - action: scrapeXPath
    url:
      - eng.hunk-ch.com/movie_detail.php
      - hunk-ch.com/movie_detail.php
      - www.hunk-ch.com/movie_detail.php
    scraper: groupScraper
    useCDP: true

# Scene scraper (individual title pages)
sceneByURL:
  - action: scrapeXPath
    url:
      - eng.hunk-ch.com/movie_detail.php
      - hunk-ch.com/movie_detail.php
      - www.hunk-ch.com/movie_detail.php
    scraper: sceneScraper
    useCDP: true

xPathScrapers:
  # ---------- Group scraper ----------
  groupScraper:
    common:
      $product: //div[contains(concat(' ',normalize-space(@class),' '),' product_detail_centre ')]
      $data: $product//div[contains(concat(' ',normalize-space(@class),' '),' data ')]

    group:
      Name:
        selector: $product//h2[1]
        postProcess:
          - replace:
              - regex: "^\s*【[^】]+】\s*"
                with: ""
              - regex: "\s*【[^】]+】\s*$"
                with: ""
              - regex: "\s{2,}"
                with: " "
              - regex: "^\s+|\s+$"
                with: ""

      Aliases:
        selector: //link[@rel="canonical"]/@href | //meta[@property="og:url"]/@content
        postProcess:
          - replace:
              - regex: "^.*?[?&]code=([^&]+).*$"
                with: "$1"
              - regex: "_IPN$"
                with: ""
              - regex: "\s+"
                with: ""

      Duration:
        selector: $data
        postProcess:
          - replace:
              - regex: "^.*?(?:収録時間 | 時間)：\s*(\d+).*$"
                with: "$1"

      Date:
        selector: $data
        postProcess:
          - replace:
              - regex: "^.*? 発売日：\s*(\d{4}-\d{2}-\d{2}).*$"
                with: "$1"
          - parseDate: "2006-01-02"

      Director:

      URLs:
        fixed: "{inputURL}"

      Synopsis:
        selector: $product//div[contains(concat(' ',normalize-space(@class),' '),' detail_title ') and contains(concat(' ',normalize-space(@class),' '),' new ')]//img[@title="ストーリー"]/following::p[1] | $product//p[normalize-space()][1]
        postProcess:
          - replace:
              - regex: "^\s+|\s+$"
                with: ""

      Studio:
        Name:
          selector: $data//a[contains(@href,"search.php?b=")]
          postProcess:
            - replace:
                - regex: "^\s+|\s+$"
                  with: ""

      Tags:
        Name:
          selector: $data//a[contains(@href,"search.php?c=")]
          postProcess:
            - replace:
                - regex: "^\s+|\s+$"
                  with: ""

      FrontImage:
        selector: $product//div[contains(concat(' ',normalize-space(@class),' '),' flexslider ')]//img[1]/@src
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.indexOf("./") === 0) v = v.substring(2);
              if (v.charAt(0) === "/") return "https://www.hunk-ch.com" + v;
              return "https://www.hunk-ch.com/" + v;

      # BackImage omitted – no stable selector identified.

  # ---------- Scene scraper ----------
  sceneScraper:
    common:
      $product: //div[contains(concat(' ',normalize-space(@class),' '),' product_detail_centre ')]
      $data: $product//div[contains(concat(' ',normalize-space(@class),' '),' data ')]

    scene:
      Title:
        selector: $product//h2[1]
        postProcess:
          - replace:
              - regex: "^\s*【[^】]+】\s*"
                with: ""
              - regex: "\s*【[^】]+】\s*$"
                with: ""
              - regex: "\s{2,}"
                with: " "
              - regex: "^\s+|\s+$"
                with: ""

      Code:
        selector: $data//dt[normalize-space(.)='品番' or normalize-space(.)='商品コード']/following-sibling::dd[1]
        postProcess:
          - javascript: |
              var v = value || "";
              return v.replace(/^[\s:：]+|[\s\u00a0]+$/gu, "").trim();

      Details:
        # Reuse same pattern as group Synopsis; adjust if site differs for scenes.
        selector: $product//div[contains(concat(' ',normalize-space(@class),' '),' detail_title ') and contains(concat(' ',normalize-space(@class),' '),' new ')]//img[@title="ストーリー"]/following::p[1] | $product//p[normalize-space()][1]
        concat: "\n"
        postProcess:
          - replace:
              - regex: "(?s)^\s+|\s+$"
                with: ""
              - regex: "\n{3,}"
                with: "\n\n"

      Director:

      URLs:
        fixed: "{inputURL}"

      Date:
        selector: $data
        postProcess:
          - replace:
              - regex: "^.*? 発売日：\s*(\d{4}-\d{2}-\d{2}).*$"
                with: "$1"
          - parseDate: "2006-01-02"

      Image:
        selector: $product//div[contains(concat(' ',normalize-space(@class),' '),' flexslider ')]//img[1]/@src
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.indexOf("./") === 0) v = v.substring(2);
              if (v.charAt(0) === "/") return "https://www.hunk-ch.com" + v;
              return "https://www.hunk-ch.com/" + v;

      Studio:
        Name:
          selector: $data//a[contains(@href,"search.php?b=")]
          postProcess:
            - replace:
                - regex: "^\s+|\s+$"
                  with: ""

      Tags:
        Name:
          selector: $data//a[contains(@href,"search.php?c=")]
          postProcess:
            - replace:
                - regex: "^\s+|\s+$"
                  with: ""

