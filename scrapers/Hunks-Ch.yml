# Hunk's Channel — public CDP version
# Public CDP version: driver.useCDP: true; no driver.cookies.
# Last Updated: 2026-08-28

name: Hunk's Channel

groupByURL:
  - action: scrapeXPath
    url:
      - eng.hunk-ch.com/movie_detail.php
      - hunk-ch.com/movie_detail.php
      - www.hunk-ch.com/movie_detail.php
    scraper: groupScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - eng.hunk-ch.com/movie_detail.php
      - hunk-ch.com/movie_detail.php
      - www.hunk-ch.com/movie_detail.php
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: "https://www.hunk-ch.com/search.php?s={}&fromSearch=on"
  scraper: searchScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  searchScraper:
    common:
      $results: "//div[@id='newmovie']//table[.//a[contains(@href,'movie_detail.php')]]"
  groupScraper:
    common:
      $product: "//div[contains(@class,'product_detail_centre')] | //table[@id='product']"
  sceneScraper:
    common:
      $product: "//div[contains(@class,'product_detail_centre')] | //table[@id='product']"

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0
