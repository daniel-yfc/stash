# KO Shop scraper — optimized for Stash XPath engine
# Tested against rendered DOM snapshots of 4 detail pages.
# - Robust class matching via normalize-space()
# - Element-based selectors (no /text() traps)
# - Fixed main-image href pattern
# - Search URL supports optional class_id

name: "KO Shop"

# -----------------------------------------------------------------------------
# URL matching & modes
# -----------------------------------------------------------------------------
sceneByURL:
  - action: scrapeXPath
    url:
      - ko-shop.com/products/detail.php
      - www.ko-shop.com/products/detail.php
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  # Usage: keyword, class_id (class_id can be empty string)
  queryURL: https://www.ko-shop.com/products/list.php?word={}&class_id={}
  scraper: searchScraper

sceneByQueryFragment:
  action: scrapeXPath
  # Usage: title fragment, class_id (class_id can be empty string)
  queryURL: https://www.ko-shop.com/products/list.php?word={}&class_id={}
  queryURLReplace:
    # First placeholder: clean title -> keyword
    - regex: '\\.[^.]+$'
      with: ''
    - regex: '[_\\.()]+'
      with: ' '
    - regex: '\\s{2,}'
      with: ' '
    - regex: '^\\s+|\\s+$'
      with: ''
  scraper: searchScraper

# -----------------------------------------------------------------------------
# XPath scrapers
# -----------------------------------------------------------------------------
xPathScrapers:
  # -------------------------------------------------------------------------
  # Search / list page scraper
  # -------------------------------------------------------------------------
  searchScraper:
    common:
      # Each product item in the list
      $results: "//section[contains(concat(' ', normalize-space(@class), ' '), ' pattern_list_col ')]//li[.//a[contains(@href, '/products/detail.php')]]"

    scene:
      Title:
        selector: "$results//div[contains(concat(' ', normalize-space(@class), ' '), ' list_title ')]//span[1]"
        postProcess:
          - replace:
              regex: '^\\s+|\\s+$'
              with: ''

      URL:
        selector: "$results//a[contains(@href, '/products/detail.php')][1]/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://www.ko-shop.com" + v;
              return "https://www.ko-shop.com/" + v;

      Image:
        selector: "$results//img[1]/@src"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://www.ko-shop.com" + v;
              return "https://www.ko-shop.com/" + v;

  # -------------------------------------------------------------------------
  # Detail page scraper
  # -------------------------------------------------------------------------
  sceneScraper:
    common:
      # Metadata block
      $meta: "//div[contains(concat(' ', normalize-space(@class), ' '), ' detail_product ')]//dl[1]"

    scene:
      Title:
        selector: "//div[contains(concat(' ', normalize-space(@class), ' '), ' detail_product ')]//h2[1]"
        postProcess:
          - replace:
              regex: '^\\s+|\\s+$'
              with: ''

      Code:
        selector: "$meta/dt[normalize-space(.)='商品コード']/following-sibling::dd[1]"
        postProcess:
          - javascript: |
              var v = value || "";
              return v.replace(/^[\s:：]+|[\s\u00a0]+$/gu, '').trim();

      URL:
        fixed: "{inputURL}"

      Date:
        selector: "$meta/dt[normalize-space(.)='発売日']/following-sibling::dd[1]"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              var m = v.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/u);
              return m ? m[1] + '-' + m[2] + '-' + m[3] : v.trim();
          - parseDate: "2006-01-02"

      Studio:
        Name:
          selector: "$meta/dt[contains(normalize-space(.),'レーベル')]/following-sibling::dd[1]//a[1] | $meta/dt[normalize-space(.)='メーカー' and not(../../dl/dt[contains(normalize-space(.),'レーベル')])]/following-sibling::dd[1]//a[1]"
          postProcess:
            - replace:
                regex: '^\\s+|\\s+$'
                with: ''

      Tags:
        Name:
          selector: "$meta/dt[normalize-space(.)='シリーズ']/following-sibling::dd[1]//a | $meta/dt[normalize-space(.)='キーワード']/following-sibling::dd[1]//a | $meta/dt[normalize-space(.)='モデルタイプ']/following-sibling::dd[1]//a"
          postProcess:
            - replace:
                regex: '^\\s+|\\s+$'
                with: ''

      Details:
        selector: "//div[contains(concat(' ', normalize-space(@class), ' '), ' ma_b30 ')]//text()[normalize-space()]"
        concat: "\n\n"
        postProcess:
          - replace:
              regex: '^\\s+|\\s+$'
              with: ''

      Image:
        # Main product image link; href looks like: uploadsaveimageXXXXX.jpg?...
        selector: "//div[contains(concat(' ', normalize-space(@class), ' '), ' detail_main_img ')]//a[contains(@href,'uploadsaveimage')][1]/@href"
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              // Strip query string
              v = v.replace(/\?.*$/, '');
              // Normalize protocol / domain
              v = v.replace(/^\/\//, 'https://');
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === '/') return 'https://www.ko-shop.com' + v;
              return 'https://www.ko-shop.com/' + v;