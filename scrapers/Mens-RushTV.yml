# Men's Rush TV — public CDP version
# Public CDP version: driver.useCDP: true; no driver.cookies.
# Last Updated: 2026-08-28

name: Men's Rush TV

sceneByURL:
  - action: scrapeXPath
    url:
      - mensrush.tv/single.php
      - www.mensrush.tv/single.php
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://www.mensrush.tv/list.php?keyword={}
  scraper: searchScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.mensrush.tv/list.php?keyword={title}
  scraper: searchScraper

xPathScrapers:
  searchScraper:
    common:
      $results: //div[contains(@class,'movie_box')][.//a[contains(@href,'single.php')]]
  sceneScraper:
    scene:
      Title:
        selector: //div[@class='detail_title'][1]//h2[1]/text()

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0
