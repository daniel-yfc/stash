# COAT — public CDP version
# Public CDP version: driver.useCDP: true; no driver.cookies.
# Last Updated: 2026-08-28

name: COAT

sceneByURL:
  - action: scrapeXPath
    url:
      - coat.co.jp/products/detail.php
      - www.coat.co.jp/products/detail.php
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: "https://www.coat.co.jp/products/list.php?mode=search&name={}"
  scraper: searchScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  searchScraper:
    common:
      $results: "//div[@id='product-list-wrap']//div[contains(@class,'list_area')][.//a[contains(@href,'/products/detail.php')]]"
    scene:
      Title:
        selector: "$results//a[contains(@href,'/products/detail.php')]//img/@alt | $results//h3"
      URLs:
        selector: "$results//a[contains(@href,'/products/detail.php')][1]/@href"
  sceneScraper:
    common:
      $jacket: "//div[@id='jacket']"
    scene:
      Title:
        selector: "//h2[contains(@class,'margin-none')][normalize-space()] | $jacket//img/@alt"
      Code:
        selector: "//script[contains(.,'eccube.classCategories')]"

driver:
  useCDP: true
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0
