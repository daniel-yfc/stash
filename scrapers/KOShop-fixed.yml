# Verification status: UNVERIFIED — selectors not yet tested against live pages
# (SKILL.md workflow step 5). Test every mode against 3+ real pages before use.
#
# Age-gate note: This site shows an 18+ confirmation page.
# Test with useCDP: true in Stash settings or per-scraper config.
# See: skills/stash-scraper-builder/references/scraping-failures.md

name: "KO Shop"

sceneByURL:
- action: scrapeXPath
  url:
  - ko-shop.com/products/detail.php
  - www.ko-shop.com/products/detail.php
  scraper: sceneScraper
  useCDP: true

sceneByName:
action: scrapeXPath
queryURL: https://www.ko-shop.com/products/list.php?word={}
scraper: searchScraper

sceneByQueryFragment:
action: scrapeXPath
queryURL: https://www.ko-shop.com/products/list.php?word={}
scraper: searchScraper

sceneByFragment:
action: scrapeXPath
queryURL: https://www.ko-shop.com/products/list.php?word={title}
queryURLReplace:
title:
- regex: '\.[^.]+$'
  with: ''
- regex: '[_\.()]+'
  with: ' '
- regex: '\s{2,}'
  with: ' '
- regex: '^\s+|\s+$'
  with: ''
scraper: searchScraper

xPathScrapers:
searchScraper:
common:
  $results: //section[contains(@class,'pattern_list_col')]//li[.//a[contains(@href,'/products/detail.php')]]

scene:
Title:
  selector: $results//div[contains(@class,'list_title')]/span[1]/text()
  postProcess:
  - replace:
    - regex: '^\s+|\s+$'
      with: ''

URLs:
  selector: $results//a[contains(@href,'/products/detail.php')][1]/@href
  postProcess:
  - javascript: |
      var v = value || "";
      if (!v) return "";
      v = v.replace(/^\/\//, "https://");
      if (v.indexOf("http") === 0) return v;
      if (v.indexOf("/") === 0) return "https://www.ko-shop.com" + v;
      return "https://www.ko-shop.com/" + v;

Image:
  selector: $results//img[1]/@src
  postProcess:
  - javascript: |
      var v = value || "";
      if (!v) return "";
      v = v.replace(/^\/\//, "https://");
      if (v.indexOf("http") === 0) return v;
      if (v.indexOf("/") === 0) return "https://www.ko-shop.com" + v;
      return "https://www.ko-shop.com/" + v;

sceneScraper:
common:
  $meta: //div[contains(@class,'detail_product')]//dl[1]

scene:
Title:
  selector: //div[contains(@class,'detail_product')]//h2[1]/text()
  postProcess:
  - replace:
    - regex: '^\s+|\s+$'
      with: ''

Code:
  selector: $meta/dt[normalize-space(.)='商品コード']/following-sibling::dd[1]/text()
  postProcess:
  - javascript: |
      var v = value || "";
      if (!v) return "";
      return v.replace(/^[\s:：]+|[\s\u00A0]+$/gu, '').trim();

URLs:
  fixed: "{inputURL}"

Date:
  selector: $meta/dt[normalize-space(.)='発売日']/following-sibling::dd[1]/text()
  postProcess:
  - javascript: |
      var v = value || "";
      if (!v) return "";
      var m = v.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/u);
      if (m) return m[1] + "-" + m[2] + "-" + m[3];
      return v.trim();
  - parseDate: "2006-01-02"

Studio:
  Name:
    selector: $meta/dt[contains(normalize-space(.),'レーベル')]/following-sibling::dd[1]//a[1]/text() | $meta/dt[normalize-space(.)='メーカー' and not(../../dl/dt[contains(normalize-space(.),'レーベル')])]/following-sibling::dd[1]//a[1]/text()
    postProcess:
    - replace:
      - regex: '^\s+|\s+$'
        with: ''

Tags:
  Name:
    selector: $meta/dt[normalize-space(.)='シリーズ']/following-sibling::dd[1]//a/text() | $meta/dt[normalize-space(.)='キーワード']/following-sibling::dd[1]//a/text() | $meta/dt[normalize-space(.)='モデルタイプ']/following-sibling::dd[1]//a/text()
    postProcess:
    - replace:
      - regex: '^\s+|\s+$'
        with: ''

Details:
  selector: //div[@class='ma_b30'][1]/text()[normalize-space()]
  concat: "\n\n"
  postProcess:
  - replace:
    - regex: '^\s+|\s+$'
      with: ''

Image:
  selector: //div[contains(@class,'detail_main_img')]//a[contains(@href,'/upload/save_image/')][1]/@href
  postProcess:
  - javascript: |
      var v = value || "";
      if (!v) return "";
      v = v.replace(/\?.*$/, "");
      v = v.replace(/^\/\//, "https://");
      if (v.indexOf("http") === 0) return v;
      if (v.indexOf("/") === 0) return "https://www.ko-shop.com" + v;
      return "https://www.ko-shop.com/" + v;
