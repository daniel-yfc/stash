# KO Shop — sceneByURL scraper
# Fixed against product_id=40277 rendered DOM:
# - Studio = シリーズ (BUMP), not メーカー (KO)
# - Date = compact 20240424 as well as 2024 年 04 月 24 日
# - Groups left empty (シリーズ is a studio/label, not a group)
# - Details from .undercol .ma_b30 text + br
#
# Age-gate note: This site shows an 18+ confirmation page.
# Test with useCDP: true in Stash settings or per-scraper config.
# See: skills/stash-scraper-builder/references/scraping-failures.md

name: "KO Shop"

sceneByURL:
  - action: scrapeXPath
    url:
      - ko-shop.com/products/detail.php
      - www.ko-shop.com/products/detail.php
    scraper: sceneScraper
    useCDP: true

xPathScrapers:
  sceneScraper:
    common:
      $meta: //div[contains(concat(' ',normalize-space(@class),' '),' detail_product ')]//dl[1]

    scene:
      Title:
        selector: //div[contains(concat(' ',normalize-space(@class),' '),' detail_product ')]//h2[1]
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ""

      Code:
        selector: $meta/dt[normalize-space(.)='商品コード']/following-sibling::dd[1]
        postProcess:
          - javascript: |
              var v = value || "";
              return v.replace(/^[\s:：]+|[\s\u00a0]+$/gu, "").trim();

      Details:
        selector: //div[contains(concat(' ',normalize-space(@class),' '),' undercol ')]/div[contains(concat(' ',normalize-space(@class),' '),' ma_b30 ')][1]//text()[normalize-space()]
        concat: "\n"
        postProcess:
          - replace:
              - regex: '(?s)^\s+|\s+$'
                with: ""
              - regex: '\n{3,}'
                with: "\n\n"

      Director:

      URLs:
        fixed: "{inputURL}"

      Date:
        selector: $meta/dt[normalize-space(.)='発売日']/following-sibling::dd[1]
        postProcess:
          - javascript: |
              var v = (value || "").replace(/[\s\u00a0]/g, "");
              if (!v) return "";
              var m = v.match(/(\d{4})[ 年\/\-\.]?(\d{1,2})[ 月\/\-\.]?(\d{1,2})/);
              if (!m) {
                m = v.match(/(\d{4})(\d{2})(\d{2})/);
              }
              if (!m) return "";
              var mm = ("0" + m[2]).slice(-2);
              var dd = ("0" + m[3]).slice(-2);
              return m[1] + "-" + mm + "-" + dd;
          - parseDate: "2006-01-02"

      Image:
        selector: //div[contains(concat(' ',normalize-space(@class),' '),' detail_main_img ')]//a[contains(@href,'upload/save_image/') or contains(@href,'uploadsaveimage')][1]/@href
        postProcess:
          - javascript: |
              var v = value || "";
              if (!v) return "";
              v = v.replace(/\?.*$/, "");
              v = v.replace(/^\/\//, "https://");
              if (/^https?:/i.test(v)) return v;
              if (v.charAt(0) === "/") return "https://www.ko-shop.com" + v;
              return "https://www.ko-shop.com/" + v;

      Studio:
        Name:
          selector: $meta/dt[normalize-space(.)='シリーズ']/following-sibling::dd[1]//a[1]
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""
            - javascript: |
                var v = (value || "").trim();
                if (v) return v;
                return "";

      Tags:
        Name:
          selector: >-
            $meta/dt[normalize-space(.)='カテゴリ']/following-sibling::dd[1]//a
            | $meta/dt[normalize-space(.)='ジャンル']/following-sibling::dd[1]//a
            | $meta/dt[normalize-space(.)='キーワード']/following-sibling::dd[1]//a
            | $meta/dt[normalize-space(.)='モデルタイプ']/following-sibling::dd[1]//a
          postProcess:
            - replace:
                - regex: '^\s+|\s+$'
                  with: ""

# Optional driver block (headers / cookies).
# If you use CDP, cookies are usually managed by the browser;
# this block is more relevant when useCDP: false.
driver:
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0
  cookies:
    - CookieURL: "https://www.ko-shop.com"
      Cookies:
        - Name: modal
          Value: off
          Domain: "ko-shop.com"
          Path: "/"
        - Name: KOSCOMID
          Value: 8erpg4bqnc4juj3ghln6j4oh82
          Domain: "ko-shop.com"
          Path: "/"
        - Name: login_email
          Value: "eddie.lu%40tensi.org"
          Domain: "ko-shop.com"
          Path: "/"

